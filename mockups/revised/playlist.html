const icons={search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/>',playlist:'<path d="M4 5h13M4 10h13M4 15h7M17 14v6m-3-3h6"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5"/>',artists:'<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M17 4a3 3 0 0 1 0 6m2 4a5 5 0 0 1 3 4v3"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="m10 3-1 3-3 1-3 3 2 3-1 3 3 3h3l2 2 3-2h3l2-3-1-3 2-3-3-3-3-1-1-3z"/>',plus:'<path d="M12 4v16M4 12h16"/>',check:'<path d="m5 12 4 4L19 6"/>',file:'<path d="M5 3h9l5 5v13H5zM14 3v6h5M8 13h8M8 17h5"/>',server:'<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M6 7h1M6 17h1"/>',arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>'};

 else if(n%6===3)shapes='<rect width="240" height="240" fill="var(--art-green)"/><path d="m25 166 43-94 48 114 47-141 54 128" fill="none" stroke="var(--art-white)" stroke-width="6"/><circle cx="169" cy="68" r="29" fill="var(--art-dark)"/><path d="M27 211h186" stroke="var(--art-yellow)" stroke-width="2"/>';
 else if(n%6===4)shapes='<rect width="240" height="240" fill="var(--art-pink)"/><path d="M0 25h240M0 65h240M0 105h240M0 145h240M0 185h240M0 225h240" stroke="var(--art-purple)" stroke-width="15"/><ellipse cx="120" cy="118" rx="50" ry="89" fill="var(--art-dark)"/>';

}

const moreIcons={library:'<path d="M4 4h4v16H4zm7 0h4v16h-4zm7 0 4 15-4 1-4-15"/>',activity:'<path d="M2 12h5l3-8 4 16 3-8h5"/>',heart:'<path d="M20 5c-3-3-7-1-8 1-1-2-5-4-8-1s-1 7 8 14C21 12 23 8 20 5Z"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',collapse:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16m7-12-4 4 4 4"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',alert:'<path d="m12 3 10 18H2zM12 9v5m0 3h.01"/>',back:'<path d="M19 12H5m5-5-5 5 5 5"/>',refresh:'<path d="M20 4v6h-6M4 20v-6h6M5 8a8 8 0 0 1 13-3l2 5M4 14l2 5a8 8 0 0 0 13-3"/>'};Object.assign(icons,moreIcons);
const songs=[{id:1,title:'Everything in Its Right Place',artist:'Radiohead',album:'Kid A',time:'4:11',state:'available',art:0},{id:2,title:'Teardrop',artist:'Massive Attack',album:'Mezzanine',time:'5:30',state:'review',art:3},{id:3,title:'Midnight City',artist:'M83',album:'Hurry Up, We’re Dreaming',time:'4:03',state:'available',art:2},{id:4,title:'Instant Crush',artist:'Daft Punk',album:'Random Access Memories',time:'5:37',state:'downloading',art:1},{id:5,title:'Roads',artist:'Portishead',album:'Dummy',time:'5:02',state:'failed',art:5},{id:6,title:'Retrograde',artist:'James Blake',album:'Overgrown',time:'3:43',state:'available',art:4},{id:7,title:'Weird Fishes / Arpeggi',artist:'Radiohead',album:'In Rainbows',time:'5:18',state:'available',art:0},{id:8,title:'Open Eye Signal',artist:'Jon Hopkins',album:'Immunity',time:'7:51',state:'available',art:2},{id:9,title:'Dayvan Cowboy',artist:'Boards of Canada',album:'The Campfire Headphase',time:'5:00',state:'missing',art:3},{id:10,title:'Intro',artist:'The xx',album:'xx',time:'2:07',state:'available',art:5},{id:11,title:'Two Weeks',artist:'FKA twigs',album:'LP1',time:'4:07',state:'missing',art:4},{id:12,title:'Angel',artist:'Massive Attack',album:'Mezzanine',time:'6:19',state:'available',art:3}];
const playlists=[{id:'night-drive',name:'Night Drive',ids:[1,2,3,4,5,6,10,12],art:9,description:'Late trains, empty roads, one more song.'},{id:'sunday-morning',name:'Sunday Morning',ids:[7,1,8],art:5,description:'A slower start, with nowhere to rush.'},{id:'work-quietly',name:'Work, quietly',ids:[8,10,7,3],art:4,description:'A little room to concentrate.'}];
const defaultModel=()=>({states:{},deferred:[],favorites:[1,6,8],collapsed:false,imported:false,selectedPlaylists:playlists.map(p=>p.id),selectedCandidate:'original',taskOverrides:{},lastImportSource:'xml'});
let model=defaultModel(),drawer=false,query='',libraryFilter='all',importSource='xml',toastTimer;
try{const saved=JSON.parse(localStorage.getItem('zensync-revised-v1'));if(saved)model={...model,...saved}}catch{}
const save=()=>{try{localStorage.setItem('zensync-revised-v1',JSON.stringify(model))}catch{}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const song=id=>songs.find(s=>s.id===Number(id));
const state=s=>model.deferred.includes(s.id)?'deferred':model.states[s.id]||s.state;
const isPlaceholder=s=>['review','failed','deferred','matched'].includes(state(s));
const label=s=>({available:'In library',review:'Needs matching',failed:'Import failed',deferred:'Skipped for now',matched:'Matched · awaiting import',downloading:'Downloading',missing:'Not downloaded'})[state(s)];
const badge=s=>`<span class="badge ${state(s)==='available'?'available':['downloading','matched'].includes(state(s))?'working':['review','failed'].includes(state(s))?'attention':state(s)==='deferred'?'deferred':'missing'}">${label(s)}</span>`;
const link=(route,text,cls='')=>`<a href="#${route}" class="${cls}">${text}</a>`;
const route=()=>location.hash.slice(1)||'/playlists/night-drive';
const path=()=>route().split('?')[0];
const params=()=>new URLSearchParams(route().split('?')[1]||'');
function go(r){drawer=false;query='';location.hash=r;render();document.querySelector('#page').focus({preventScroll:true})}

const favorite=s=>`<button class="icon-btn ${model.favorites.includes(s.id)?'starred':''}" data-action="favorite" data-id="${s.id}" aria-label="${model.favorites.includes(s.id)?'Remove':'Add'} ${esc(s.title)} ${model.favorites.includes(s.id)?'from':'to'} favorites" aria-pressed="${model.favorites.includes(s.id)}">${ico('heart')}</button>`;
function navItem(r,n,i,extra=''){let active=path().startsWith(r);return `<a href="#${r}" class="nav-item ${active?'active':''}" ${active?'aria-current="page"':''} title="${n}" aria-label="${n}">${ico(i)}<span class="label">${n}</span>${extra}</a>`}
function sidebar(){document.querySelector('#sidebar').innerHTML=`<div class="sidebar-head"><a href="#/playlists/night-drive" class="brand" aria-label="ZenSync home"><span class="brand-icon">${ico('playlist')}</span><span class="label">ZenSync</span></a><button class="collapse-button" data-action="collapse" aria-label="${model.collapsed?'Expand':'Collapse'} sidebar" title="${model.collapsed?'Expand':'Collapse'} sidebar" aria-expanded="${!model.collapsed}">${ico('collapse')}</button></div>${navItem('/library','Library','library')}${navItem('/playlists','Playlists','playlist')}${navItem('/search','Search','search')}<div class="side-label">Manage your music</div>${navItem('/imports','Imports','file')}${navItem('/activity','Activity','activity',`<span class="count">${tasks().filter(t=>t.status==='running').length}</span>`)}${navItem('/followed-artists','Followed artists','artists')}<div class="side-bottom">${navItem('/settings','Settings','settings')}<div class="connection"><i class="dot"></i> Navidrome connected<br>Deezer ready</div></div>`;document.querySelector('#shell').classList.toggle('collapsed',model.collapsed);document.querySelector('#shell').classList.toggle('drawer-open',drawer)}
function topbar(parent,title){document.querySelector('#topbar').innerHTML=`<button class="icon-btn mobile-menu" data-action="drawer" aria-expanded="${drawer}" aria-controls="sidebar" aria-label="Open navigation">${ico('menu')}</button><div class="crumbs"><span>${parent}</span><span>/</span><span class="current">${esc(title)}</span></div><a href="#/settings/connections" class="pill" aria-label="Navidrome connected"><i class="dot"></i> Navidrome connected</a>`}

function songRow(s,index,playlistId){let placeholder=isPlaceholder(s),reason=state(s)==='deferred'?'Your place is saved. Other songs continue.':state(s)==='failed'?'File import failed. Your match is saved.':state(s)==='matched'?'Your place stays reserved until import finishes.':'No exact match yet. Your place is saved.';return `<div class="song-row ${placeholder?'placeholder':''} ${state(s)==='deferred'?'deferred-row':''}" data-entry="${s.id}"><span class="song-num">${String(index+1).padStart(2,'0')}</span><div class="song-info">${link(isPlaceholder(s)?'/review/'+s.id:'/library/songs/'+s.id,esc(s.title),'song-title')}<div class="song-detail">${esc(s.artist)}${placeholder?'':` · ${s.time}`}</div>${placeholder?`<span class="placeholder-note">${reason}</span>`:''}</div><div class="song-actions">${placeholder?(state(s)==='matched'?`${badge(s)}${link('/activity/'+(s.id===5?'import-5':'resolve-'+s.id),'View','btn outline')}`:`${link('/review/'+s.id,state(s)==='failed'?'Review import':state(s)==='deferred'?'Resolve':'Resolve','btn outline')}${state(s)==='deferred'?'<span class="badge deferred">Deferred</span>':`<button class="btn quiet" data-action="skip" data-id="${s.id}">Skip for now</button>`}`):badge(s)}</div>${placeholder?'':favorite(s)}</div>`}
function playlistPage(p){topbar('Playlists',p.name);let tracks=p.ids.map(song),available=tracks.filter(s=>state(s)==='available').length,attention=tracks.filter(s=>['review','failed','deferred'].includes(state(s))).length;return `<div class="playlist-layout"><aside class="sleeve-column"><div class="sleeve">${cover(p.art)}</div><div class="sleeve-meta"><strong>From your Apple Music library</strong><p>${tracks.length} songs · Ordered as imported</p><p>Library.xml<br>Imported today, 18:42</p><div style="margin-top:15px"><span class="green">${available} available on Navidrome</span><br>${tracks.length-available} places still reserved</div>${link('/imports/sample','View source import','btn outline')}</div></aside><section><div class="flex between"><span class="small muted">Your playlists</span>${link('/imports/new',ico('plus')+' Import','btn quiet compact')}</div><h1 class="playlist-title">${p.name}</h1><p class="subtitle">${p.description}</p><div class="playlist-summary"><span><b>${available}</b> in library</span><span><b>${tracks.filter(s=>['downloading','matched'].includes(state(s))).length}</b> in progress</span><span><b>${attention}</b> need attention</span></div><div class="track-list">${tracks.map((s,i)=>songRow(s,i,p.id)).join('')}</div><div class="playlist-bottom"><p>Unresolved songs keep their original places. Available songs can sync while you decide.</p>${link('/activity?view=all','View activity','btn primary')}</div></section></div>`}
function playlistsPage(){topbar('Music','Playlists');return intro('Your playlists','Your imported sequences, with every song accounted for.',link('/imports/new',ico('plus')+' Import','btn primary'))+`<div class="playlist-cards">${playlists.map(p=>link('/playlists/'+p.id,cover(p.art,'rounded')+`<h3>${p.name}</h3><p>${p.ids.length} songs · Apple Music XML</p><p>${p.ids.map(song).filter(s=>state(s)==='available').length} available · order preserved</p>`,'music-card')).join('')}</div><div class="notice mt">A playlist can contain unavailable songs. Its full sequence stays here; only available recordings appear in Navidrome.</div>`}
function libraryTabs(active){return `<nav class="subnav" aria-label="Library views">${['songs','artists','albums','favorites'].map(n=>link('/library/'+n,n[0].toUpperCase()+n.slice(1),n===active?'active':'')).join('')}</nav>`}
function libraryRow(s){return `<div class="library-row">${cover(s.art,'mini')}<div class="song-info">${link(state(s)==='matched'?'/activity/'+(s.id===5?'import-5':'resolve-'+s.id):isPlaceholder(s)?'/review/'+s.id:'/library/songs/'+s.id,s.title,'song-title')}<div class="song-detail">${s.artist} · ${s.album}</div></div>${badge(s)}${favorite(s)}</div>`}
function libraryPage(view){view=['songs','artists','albums','favorites'].includes(view)?view:'songs';topbar('Library',view[0].toUpperCase()+view.slice(1));let arr=songs.filter(s=>(view!=='favorites'||model.favorites.includes(s.id))&&`${s.title} ${s.artist} ${s.album}`.toLowerCase().includes(query.toLowerCase())&&(libraryFilter==='all'||(libraryFilter==='available'?state(s)==='available':state(s)!=='available')));let body=intro('Your library','All your songs, including music waiting to join Navidrome.',link('/imports/new',ico('file')+' Import','btn outline'))+libraryTabs(view)+`<div class="toolbar">${searchbox(view==='artists'?'Find an artist':view==='albums'?'Find an album':'Find a song')}<select class="select" data-select="availability" aria-label="Availability"><option value="all" ${libraryFilter==='all'?'selected':''}>All songs</option><option value="available" ${libraryFilter==='available'?'selected':''}>Available in Navidrome</option><option value="missing" ${libraryFilter==='missing'?'selected':''}>Not available yet</option></select></div>`;
if(view==='artists'){let artists=[...new Set(arr.map(s=>s.artist))];return body+`<div class="artist-grid">${artists.map(a=>{let list=arr.filter(s=>s.artist===a);return link('/library/artists/'+slug(a),cover(list[0].art)+`<h3>${a}</h3><p>${songs.filter(s=>s.artist===a).length} songs in your catalog</p>`,'artist-card')}).join('')}</div>`}
if(view==='albums'){let albums=[...new Set(arr.map(s=>s.album))];return body+`<div class="album-grid">${albums.map(a=>{let list=arr.filter(s=>s.album===a);return link('/library/albums/'+slug(a),cover(list[0].art,'rounded')+`<h3>${a}</h3><p>${list[0].artist}</p><p>${list.filter(s=>state(s)==='available').length} of ${list.length} catalog songs available</p>`,'music-card')}).join('')}</div>`}
return body+`<p class="library-note">${arr.length} songs${view==='favorites'?' you’ve favorited':' in your catalog'}${libraryFilter==='all'&&view==='songs'?' · 2 songs outside playlists':''}</p><div id="library-list">${arr.length?arr.map(libraryRow).join(''):'<div class="empty">No songs match this view. Try another filter.</div>'}</div><p class="footer-note mt">Imported metadata is kept even when a song hasn’t been downloaded.</p>`}
function catalogDetail(kind,id){let s,arr,title;if(kind==='songs'){s=song(id);if(!s)return notFound();arr=[s];title=s.title}else{arr=songs.filter(s=>slug(kind==='artists'?s.artist:s.album)===id);if(!arr.length)return notFound();s=arr[0];title=kind==='artists'?s.artist:s.album}topbar('Library',title);return link('/library/'+kind,ico('back')+' Back to '+kind,'btn quiet compact')+`<div class="detail-heading mt">${cover(s.art)}<div><h1>${esc(title)}</h1><p>${kind==='songs'?s.artist+' · '+s.album:kind==='albums'?s.artist:arr.length+' songs in your catalog'}</p>${kind==='songs'?badge(s):'<span class="pill">Catalog and library</span>'}</div></div>${kind==='songs'?`<div class="detail-panel"><dl><dt>Duration</dt><dd>${s.time}</dd><dt>Source</dt><dd>Apple Music XML</dd><dt>Playlists</dt><dd>${playlists.filter(p=>p.ids.includes(s.id)).map(p=>link('/playlists/'+p.id,p.name)).join(', ')||'Not in a playlist'}</dd><dt>Availability</dt><dd>${label(s)}</dd></dl></div><div class="flex">${favorite(s)}<span class="small muted">Save to Favorites</span>${state(s)==='missing'?`<button class="btn primary" data-action="download" data-id="${s.id}">Download song</button>`:''}</div>`:arr.map(libraryRow).join('')}`}
function tasks(){let list=[{id:'download-4',title:'Instant Crush',operation:'Downloading music',type:'download',status:state(song(4))==='available'?'completed':'running',detail:'Daft Punk · FLAC',origin:'Wavio',progress:42,elapsed:'32 sec',song:4},{id:'metadata',title:'Matching imported songs',operation:'Metadata lookup',type:'metadata',status:'running',detail:'Apple Music + Deezer · 7 of 12 checked',origin:'Library.xml',progress:58,elapsed:'18 sec'},{id:'import-5',title:'Roads',operation:'Importing song',type:'import',status:state(song(5))==='deferred'?'deferred':state(song(5))==='available'?'completed':state(song(5))==='matched'?'queued':'attention',detail:state(song(5))==='deferred'?'Skipped for now · position retained':state(song(5))==='matched'?'Retry queued · chosen metadata and staged file retained':state(song(5))==='available'?'File imported and verified':'Tag write failed · correct recording is already matched',origin:'Night Drive',song:5,elapsed:'1 min ago'},{id:'review-2',title:'Teardrop',operation:'Matching song',type:'metadata',status:state(song(2))==='deferred'?'deferred':state(song(2))==='available'?'completed':state(song(2))==='matched'?'completed':'attention',detail:state(song(2))==='deferred'?'Skipped for now · playlist position 02 retained':['matched','available'].includes(state(song(2)))?'Match confirmed · original playlist position retained':'Two release versions need a decision',origin:'Night Drive',song:2,elapsed:'2 min ago'},{id:'scan',title:'Update Navidrome library',operation:'Library scan',type:'scan',status:'queued',detail:'Waiting for downloaded files to finish importing',origin:'Automatic',elapsed:'Waiting'},{id:'sync',title:'Sync Night Drive',operation:'Playlist sync',type:'sync',status:'queued',detail:'Waiting for library scan · available songs only',origin:'Automatic',elapsed:'Waiting'},{id:'xml',title:'Library.xml imported',operation:'Import catalog',type:'import',status:'completed',detail:'12 songs and 3 playlists · metadata only',origin:'Web',elapsed:'18:42'}];for(const s of songs.filter(s=>state(s)==='matched'&&s.id!==5))list.push({id:'resolve-'+s.id,title:s.title,operation:'Import matched song',type:'import',status:'queued',detail:'Match saved · playlist position stays reserved',origin:'Manual review',song:s.id,elapsed:'Just now'});return list.map(t=>({...t,status:model.taskOverrides[t.id]||t.status}))}
const taskBadge=t=>`<span class="badge ${t.status==='running'?'working':t.status==='completed'?'available':t.status==='attention'?'attention':'deferred'}">${{running:'Running',queued:'Queued',attention:'Needs attention',deferred:'Skipped for now',completed:'Completed',cancelled:'Cancelled'}[t.status]}</span>`;
function activityPage(){topbar('Server','Activity');let view=params().get('view')||'all',type=params().get('type')||'all';let all=tasks(),arr=all.filter(t=>(view==='all'||(view==='attention'?['attention','deferred'].includes(t.status):view==='history'?['completed','cancelled'].includes(t.status):t.status===view))&&(type==='all'||t.type===type));return intro('Activity','Work happening across your server, including requests from Wavio.')+`<nav class="subnav activity-tabs" aria-label="Activity status">${[['all','All'],['running','Running'],['queued','Queued'],['attention','Needs attention'],['history','History']].map(([v,n])=>link('/activity?view='+v,n+' '+(v==='all'?all.length:all.filter(t=>v==='attention'?['attention','deferred'].includes(t.status):v==='history'?['completed','cancelled'].includes(t.status):v===t.status).length),v===view?'active':'')).join('')}</nav><div class="toolbar"><select class="select" data-select="task-type" aria-label="Activity type">${[['all','All operations'],['download','Downloads'],['metadata','Metadata'],['import','Imports'],['scan','Library scans'],['sync','Playlist syncs']].map(([v,n])=>`<option value="${v}" ${type===v?'selected':''}>${n}</option>`).join('')}</select><span class="spacer"></span><span class="small muted">Sample server activity</span></div>${arr.length?arr.map(t=>link('/activity/'+t.id,`<span class="task-icon">${ico(t.type==='download'?'download':t.type==='metadata'?'search':t.type==='scan'?'server':t.type==='sync'?'playlist':'file')}</span><div><div class="task-name">${t.title}</div><p class="task-sub">${t.operation} · ${t.origin}</p><p class="task-sub">${t.detail}</p>${t.progress&&t.status==='running'?`<div class="progress"><span style="width:${t.progress}%"></span></div>`:''}</div><div class="task-side">${taskBadge(t)}<small>${t.progress&&t.status==='running'?t.progress+'% · ':''}${t.elapsed}</small></div><span class="row-arrow muted">${ico('arrow')}</span>`,'activity-row')).join(''):'<div class="empty">No operations in this view.</div>'}<div class="activity-info">Skipped items stay under Needs attention, never Running.<br>Closing this page does not stop server work in the planned application.</div>`}
function taskPage(id){let t=tasks().find(t=>t.id===id);if(!t)return notFound();let related=playlists.find(p=>p.ids.includes(t.song));topbar('Activity',t.title);let canComplete=t.song&&['running','queued'].includes(t.status);return link('/activity',ico('back')+' All activity','btn quiet compact')+`<div class="page-intro mt"><div><h1>${t.title}</h1><p>${t.operation} · Started from ${t.origin}</p></div>${taskBadge(t)}</div><div class="detail-panel"><dl><dt>Operation</dt><dd>${t.operation}</dd><dt>Requested by</dt><dd>${t.origin}</dd><dt>Current stage</dt><dd>${t.detail}</dd><dt>Related playlist</dt><dd>${related?link('/playlists/'+related.id,related.name,'rose'):t.song?'Not in a playlist':'Library catalog'}</dd></dl></div>${t.status==='attention'||t.status==='deferred'?`<div class="notice warn"><strong>${t.status==='deferred'?'This item can wait.':'One song needs attention.'}</strong><br>Its playlist position is reserved. Other songs continue processing.</div><div class="flex mt">${link('/review/'+t.song,'Review this song','btn primary')}${t.status!=='deferred'?`<button class="btn outline" data-action="skip" data-id="${t.song}">Skip for now</button>`:''}</div>`:`<h2 class="mt">What happens next</h2><ul class="timeline"><li>Original playlist entry saved<small>The source metadata and song order stay intact.</small></li><li class="${t.status==='completed'?'':'pending'}">Download and import recording<small>Validate the file, write tags and add artwork.</small></li><li class="${t.status==='completed'?'':'pending'}">Find the song in Navidrome<small>Wait for its library scan to finish.</small></li><li class="${t.status==='completed'?'':'pending'}">Sync the available playlist<small>${related?'Use the original order, including this song when ready.':'The song becomes available in your library.'}</small></li></ul>`}${canComplete?`<div class="notice"><strong>Prototype control</strong><br>Simulate a successful download, file import and Navidrome scan to see the reserved playlist entry become available.</div><div class="page-actions"><button class="btn outline" data-action="cancel-task" data-id="${t.id}">Cancel sample task</button><button class="btn primary" data-action="complete" data-id="${t.song}">Simulate completed import</button></div>`:''}`}
function importsPage(){topbar('Sources','Imports');return intro('Imports','Your source libraries, playlists and import history.',link('/imports/new',ico('plus')+' New import','btn primary'))+link('/imports/sample',`<span class="task-icon">${ico('file')}</span><div><h3>Library.xml</h3><p class="task-sub">Apple Music · 12 songs · 3 playlists</p><p class="task-sub">Includes 2 songs outside all playlists</p></div><span class="badge available">Catalog saved</span><span>${ico('arrow')}</span>`,'activity-row')+`<div class="notice mt">An XML export contains your full song catalog and playlist memberships. Importing it saves metadata; downloading music is a separate action.</div>`}
function newImportPage(){topbar('Imports','New import');return `<div class="steps"><span class="active">1. Choose source</span><span>2. Preview</span><span>3. Import</span></div>`+intro('Bring your library over','Import your songs and the playlists they belong to.')+`<div class="source-options">${[['xml','Apple Music XML','Full library, songs and playlists','file'],['link','Public playlist link','An Apple Music playlist URL','playlist'],['file','Playlist file','CSV, TSV, TXT or M3U','file']].map(([v,n,d,i])=>`<button class="source-option ${importSource===v?'active':''}" data-action="source" data-source="${v}" aria-pressed="${importSource===v}">${ico(i)}<h3>${n}</h3><p>${d}</p></button>`).join('')}</div>${importSource==='link'?`<label class="inline-field" for="source-url">Apple Music playlist URL</label><input id="source-url" class="text-input" placeholder="https://music.apple.com/…" value="https://music.apple.com/us/playlist/night-drive/pl.sample"><div class="notice mt">Public playlists only. This mockup previews the sample Night Drive playlist.</div><div class="page-actions">${link('/imports','Cancel','btn outline')}${link('/imports/sample/preview?source=link','Preview sample playlist','btn primary')}</div>`:`<div class="file-drop">${ico('file')}<h2>${importSource==='xml'?'Library.xml':'Night Drive.csv'}</h2><p>${importSource==='xml'?'The full library export includes every song, all playlists and their ordered song references.':'Import a track list and review the matches before downloading.'}</p>${link('/imports/sample/preview?source='+importSource,importSource==='xml'?'Preview sample XML':'Preview sample file','btn primary')}</div><div class="notice"><strong>No automatic downloads.</strong><br>Save the complete catalog first. Choose what to download afterwards.</div><p class="footer-note mt">Sample file only. No local file is read by this prototype.</p>`}`}
function importPreview(){let xml=(params().get('source')||'xml')==='xml';topbar('Imports','Preview '+(xml?'Library.xml':'playlist'));return `<div class="steps"><span>1. Choose source</span><span class="active">2. Preview</span><span>3. Import</span></div>`+intro(xml?'Your whole library, intact.':'Preview your playlist',xml?'Save every music record and choose which playlists to bring with it.':'Keep the source song order and review unavailable tracks afterwards.')+`<div class="import-stats"><div><strong>${xml?12:8}</strong><span>Music songs</span></div><div><strong>${xml?3:1}</strong><span>Playlists found</span></div><div><strong>${xml?2:0}</strong><span>Songs outside playlists</span></div></div>${xml?'<div class="notice"><strong>All 12 songs will enter your catalog.</strong><br>This includes Dayvan Cowboy and Two Weeks, which belong to no playlist. Deselecting a playlist does not discard its songs.</div>':''}<div class="section-head"><h2>Playlist memberships</h2><span>Original order preserved</span></div>${(xml?playlists:[playlists[0]]).map(p=>`<label class="import-choice"><input type="checkbox" data-playlist="${p.id}" ${model.selectedPlaylists.includes(p.id)?'checked':''}>${cover(p.art)}<span><strong>${p.name}</strong><small>${p.ids.length} song references${p.id==='night-drive'?' · 2 need attention':''}</small></span><span class="badge deferred">Metadata only</span></label>`).join('')}<div class="notice mt"><strong>Unresolved songs won’t block the import.</strong><br>Their playlist positions stay reserved. Resolve them now, later, or skip them for now.</div><div class="page-actions">${link('/imports/new',ico('back')+' Back','btn outline')}<span class="muted">Nothing will download yet.</span><button class="btn primary" data-action="import">${xml?'Import library':'Import playlist'}</button></div>`}
function importResult(){if(model.lastImportSource&&model.lastImportSource!=='xml'){topbar('Imports','Night Drive');return intro('Night Drive imported','Eight ordered song references saved. No downloads started.')+'<div class="notice">This source contains one playlist. It does not describe your complete Apple Music library.</div><ul class="summary-checks"><li>'+ico('check')+'8 songs retained in source order</li><li>'+ico('check')+'Unresolved entries kept as placeholders</li></ul><div class="page-actions">'+link('/imports/new','Import another source','btn outline')+link('/playlists/night-drive','Open playlist','btn primary')+'</div>'}topbar('Imports','Library.xml');return intro('Library.xml','Your source catalog is saved. Matching continues separately.',link('/imports/new','Re-import XML','btn outline'))+`<div class="notice"><strong class="green">Catalog import complete</strong><br>Metadata saved. No downloads were started by this import.</div><ul class="summary-checks"><li>${ico('check')}All 12 music songs retained in your catalog</li><li>${ico('check')}${model.selectedPlaylists.length} playlists selected, with ordered song references</li><li>${ico('check')}2 songs outside playlists are still included</li><li>${ico('check')}Unresolved entries kept as placeholders</li></ul><div class="section-head"><h2>Choose what happens next</h2></div><div class="choice-row"><div><h3>Review Night Drive</h3><p>Skip unresolved songs or choose a match.</p></div>${link('/playlists/night-drive','Open playlist','btn outline')}</div><div class="choice-row"><div><h3>See the full song catalog</h3><p>Available and not-yet-downloaded music together.</p></div>${link('/library/songs','Open library','btn outline')}</div><div class="choice-row"><div><h3>Check server work</h3><p>Downloads, metadata lookups and song imports.</p></div>${link('/activity','View activity','btn outline')}</div><p class="footer-note mt">Re-import updates this source snapshot. Existing files are not deleted.</p>`}
function reviewPage(id){let s=song(id);if(!s)return notFound();let failed=s.id===5,def=state(s)==='deferred';topbar('Review',s.title);return link('/playlists/night-drive',ico('back')+' Back to Night Drive','btn quiet compact')+intro(failed?'Keep the match. Retry the import.':'Keep the right recording.',failed?'The recording was identified. A file import error should not make you match it again.':'Choose a recording when you’re ready. The rest of the playlist can continue.')+`<div class="review-layout"><aside class="original-record"><span class="small muted">Original XML entry</span>${cover(s.art)}<h3>${s.title}</h3><p>${s.artist}<br>${s.album}<br>${s.time}</p><div class="placeholder-example">Night Drive<br><b>Position ${s.id===2?'02':'05'} is reserved</b></div></aside><section>${failed?`<h2>Import couldn’t finish</h2><div class="notice warn"><strong>Could not write album artwork.</strong><br>The staged audio file and chosen metadata are retained. Retry this stage or skip it for now.</div><div class="detail-panel"><dl><dt>Match</dt><dd>Original album recording</dd><dt>File</dt><dd>Validated FLAC</dd><dt>Failed stage</dt><dd>Writing artwork</dd></dl></div>`:`<h2>Possible recordings</h2><p class="subtitle">Compare release details with the original entry.</p><label class="candidate"><div class="flex"><input type="radio" name="candidate" value="original" ${model.selectedCandidate==='original'?'checked':''}><div><h3>Teardrop</h3><p>Massive Attack · Mezzanine<br>Original album · 5:30 · Deezer</p><div class="evidence">Title, artist and duration agree</div></div></div></label><label class="candidate"><div class="flex"><input type="radio" name="candidate" value="alternate" ${model.selectedCandidate==='alternate'?'checked':''}><div><h3>Teardrop</h3><p>Massive Attack · Mezzanine<br>Anniversary release · 5:31 · Deezer</p><div class="small muted mt-sm">Different release edition</div></div></div></label>`}<div class="notice"><strong>${def?'You skipped this for now.':'You don’t need to decide now.'}</strong><br>Skipping keeps the original playlist entry. It won’t retry until you resume or accept a match.</div></section></div><div class="page-actions"><button class="btn outline" data-action="skip-back" data-id="${s.id}">Skip for now</button><span class="muted">Other songs continue.</span><button class="btn primary" data-action="${failed?'retry-import':'resolve'}" data-id="${s.id}">${failed?'Retry file import':'Use match & continue'}</button></div>`}
function searchPage(){topbar('Music','Search');let q=params().get('q')||'',source=params().get('source')||'deezer';let arr=songs.filter(s=>`${s.title} ${s.artist} ${s.album}`.toLowerCase().includes(q.toLowerCase()));return intro('Find your music','Search metadata, then choose what to add to your library.')+`<form id="catalog-form"><div class="toolbar"><label class="searchbox">${ico('search')}<input id="catalog-q" name="q" value="${esc(q)}" placeholder="Artist, album or song" aria-label="Search music"></label><select class="select" id="catalog-source" name="source" aria-label="Metadata source"><option value="deezer" ${source==='deezer'?'selected':''}>Deezer</option><option value="itunes" ${source==='itunes'?'selected':''}>Apple Music</option></select><button class="btn primary" type="submit">Search</button></div></form><div class="section-head"><h2>${q?'Results for “'+esc(q)+'”':'Sample catalog'}</h2><span>${arr.length} songs</span></div>${arr.map(libraryRow).join('')||'<div class="empty">No sample results. Try Radiohead or Massive Attack.</div>'}<p class="footer-note mt">This prototype filters sample data instead of contacting music providers.</p>`}
function followedPage(){topbar('Music','Followed artists');return intro('Followed artists','Check artists you choose for releases missing from your library.','<button class="btn primary" data-action="check-artists">Check releases</button>')+`<div class="artist-grid">${['Radiohead','Massive Attack','James Blake'].map(a=>{let s=songs.find(s=>s.artist===a);return link('/library/artists/'+slug(a),cover(s.art)+`<h3>${a}</h3><p>Following · Checked today</p>`,'artist-card')}).join('')}</div>`}
function settingsPage(){topbar('Settings','Connections');return intro('Connections','The services that bring music into your library.')+`<div class="choice-row"><div><h3>Navidrome</h3><p>Your playable library and playlists</p></div><span class="badge available">Connected</span></div><div class="choice-row"><div><h3>Deezer</h3><p>Your download account</p></div><span class="badge available">Ready</span></div><div class="choice-row"><div><h3>Wavio</h3><p>Compatible music requests and artist follows</p></div><span class="badge available">Ready</span></div><label class="inline-field" for="quality">Download quality</label><select class="select" id="quality"><option>FLAC</option><option>MP3 320</option></select><div class="notice mt">All connection states are illustrative. This mockup stores no credentials.</div>`}
function notFound(){topbar('Music','Page not found');return intro('This page isn’t in the sample.','Return to your playlist to continue exploring.',link('/playlists/night-drive','Open Night Drive','btn primary'))}
function render(){let p=path(),parts=p.split('/').filter(Boolean),html;if(p==='/playlists')html=playlistsPage();else if(parts[0]==='playlists')html=playlistPage(playlists.find(p=>p.id===parts[1])||playlists[0]);else if(parts[0]==='library')html=parts[2]?catalogDetail(parts[1],parts[2]):libraryPage(parts[1]);else if(p==='/activity')html=activityPage();else if(parts[0]==='activity')html=taskPage(parts[1]);else if(p==='/imports/new')html=newImportPage();else if(p==='/imports/sample/preview')html=importPreview();else if(p==='/imports/sample')html=importResult();else if(p==='/imports')html=importsPage();else if(parts[0]==='review')html=reviewPage(parts[1]);else if(p==='/search')html=searchPage();else if(p==='/followed-artists')html=followedPage();else if(parts[0]==='settings')html=settingsPage();else html=notFound();document.querySelector('#page').innerHTML=html;sidebar()}
function defer(id,back=false){id=Number(id);if(!model.deferred.includes(id))model.deferred.push(id);save();if(back)go('/playlists/night-drive');else render();notify('Skipped for now. Its playlist position is saved.')}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=Number(b.dataset.id);
if(a==='collapse'){model.collapsed=!model.collapsed;save();sidebar();return}
if(a==='drawer'||a==='drawer-close'){drawer=a==='drawer';sidebar();if(drawer)document.querySelector('.sidebar .brand').focus();else document.querySelector('.mobile-menu').focus();return}
if(a==='favorite'){let i=model.favorites.indexOf(id);if(i===-1)model.favorites.push(id);else model.favorites.splice(i,1);save();render();return}
if(a==='skip'||a==='skip-back'){defer(id,a==='skip-back');return}
if(a==='resolve'||a==='retry-import'){model.states[id]='matched';model.deferred=model.deferred.filter(n=>n!==id);save();go('/activity/'+(id===5?'import-5':'resolve-'+id));notify(a==='resolve'?'Match saved. Playlist position stays reserved until import finishes.':'Correct match kept. File import queued again.');return}
if(a==='complete'){model.states[id]='available';model.deferred=model.deferred.filter(n=>n!==id);if(id===4)model.taskOverrides['download-4']='completed';save();let parent=playlists.find(p=>p.ids.includes(id));go(parent?'/playlists/'+parent.id:'/library/songs/'+id);notify(parent?'Demo: song imported and playlist synced in its original position.':'Demo: song imported into the library.');return}
if(a==='cancel-task'){model.taskOverrides[b.dataset.id]='cancelled';save();render();notify('Sample task cancelled. The playlist entry is retained.');return}
if(a==='source'){importSource=b.dataset.source;render();return}
if(a==='import'){model.lastImportSource=params().get('source')||'xml';if(model.lastImportSource!=='xml')model.selectedPlaylists=['night-drive'];model.imported=true;save();go('/imports/sample');notify('Sample catalog imported. No downloads started.');return}
if(a==='download'){model.states[id]='matched';save();go('/activity/resolve-'+id);return}
if(a==='check-artists'){notify('Demo: followed artists checked. No missing releases found.');return}
if(a==='reset'){model=defaultModel();save();query='';libraryFilter='all';go('/playlists/night-drive');notify('Sample reset.');return}
});
document.addEventListener('click',e=>{let a=e.target.closest('a[href^="#/"]');if(!a||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;e.preventDefault();go(a.getAttribute('href').slice(1))});
document.addEventListener('change',e=>{if(e.target.matches('[data-select="availability"]')){libraryFilter=e.target.value;render()}if(e.target.matches('[data-select="task-type"]'))go('/activity?view='+(params().get('view')||'all')+'&type='+e.target.value);if(e.target.matches('[data-playlist]')){let id=e.target.dataset.playlist;if(e.target.checked){if(!model.selectedPlaylists.includes(id))model.selectedPlaylists.push(id)}else model.selectedPlaylists=model.selectedPlaylists.filter(v=>v!==id);save()}if(e.target.name==='candidate'){model.selectedCandidate=e.target.value;save()}});
document.addEventListener('input',e=>{if(!e.target.matches('[data-input="library"]'))return;query=e.target.value;let pos=e.target.selectionStart;render();let i=document.querySelector('[data-input="library"]');if(i){i.focus();i.setSelectionRange(pos,pos)}});
document.addEventListener('submit',e=>{if(e.target.id!=='catalog-form')return;e.preventDefault();go('/search?q='+encodeURIComponent(document.querySelector('#catalog-q').value)+'&source='+document.querySelector('#catalog-source').value)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&drawer){drawer=false;sidebar();document.querySelector('.mobile-menu').focus()}if(e.key==='Tab'&&drawer){let focusables=[...document.querySelectorAll('.sidebar a,.sidebar button')].filter(el=>el.getClientRects().length);let first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('hashchange',()=>{drawer=false;query='';render()});
if(location.protocol==='file:'){document.body.style.background='var(--background)';document.body.style.padding='20px'}
if(!location.hash)location.hash='/playlists/night-drive';render();
/* QA_HOOK */
</script></body></html>
