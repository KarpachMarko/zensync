<body><main class="gallery"><div class="chooser" role="tablist" aria-label="UI design directions" id="chooser"></div><div class="concept-note" id="concept-note"></div><section class="app" id="app" role="tabpanel" aria-label="Selected UI mockup"></section><div class="sample-footer"><span>Interactive mockup. Sample data and illustrative artwork.</span><span>No services connected</span></div></main>
<dialog id="modal" aria-labelledby="modal-title"><div class="dialog-head"><h2 id="modal-title"></h2><button class="btn quiet" data-action="close" aria-label="Close dialog">✕</button></div><div class="dialog-body" id="modal-body"></div><div class="dialog-foot" id="modal-foot"></div></dialog><div class="toast" id="toast" role="status" hidden></div>
<script>
const icons={search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/>',playlist:'<path d="M4 5h13M4 10h13M4 15h7M17 14v6m-3-3h6"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5"/>',artists:'<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M17 4a3 3 0 0 1 0 6m2 4a5 5 0 0 1 3 4v3"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="m10 3-1 3-3 1-3 3 2 3-1 3 3 3h3l2 2 3-2h3l2-3-1-3 2-3-3-3-3-1-1-3z"/>',plus:'<path d="M12 4v16M4 12h16"/>',check:'<path d="m5 12 4 4L19 6"/>',file:'<path d="M5 3h9l5 5v13H5zM14 3v6h5M8 13h8M8 17h5"/>',server:'<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M6 7h1M6 17h1"/>',arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>'};
const ico=(n)=>`<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[n]||icons.playlist}</svg>`;
const concepts=[{id:'collection',name:'Collection',short:'Album focused',desc:'Music first, with a persistent sidebar and a visual collection.'},{id:'workbench',name:'Workbench',short:'Precise & compact',desc:'A review table with an inspector for matching and bulk actions.'},{id:'mixtape',name:'Mixtape',short:'Playlist focused',desc:'A sleeve, an ordered track list, and space for the music to breathe.'},{id:'signal',name:'Signal',short:'Queue focused',desc:'A board that separates decisions, downloads and music ready to sync.'},{id:'pocket',name:'Pocket',short:'Mobile first',desc:'A compact, touch-friendly workspace with a contextual detail sheet.'}];
const tracks=[{id:1,title:'Everything in Its Right Place',artist:'Radiohead',album:'Kid A',time:'4:11',state:'owned',art:0},{id:2,title:'Instant Crush',artist:'Daft Punk',album:'Random Access Memories',time:'5:37',state:'pending',art:1},{id:3,title:'Midnight City',artist:'M83',album:'Hurry Up, We’re Dreaming',time:'4:03',state:'owned',art:2},{id:4,title:'Teardrop',artist:'Massive Attack',album:'Mezzanine',time:'5:30',state:'review',art:3},{id:5,title:'Retrograde',artist:'James Blake',album:'Overgrown',time:'3:43',state:'pending',art:4},{id:6,title:'Roads',artist:'Portishead',album:'Dummy',time:'5:02',state:'review',art:5}];
let current='workbench',query='',filter='all',selected=4,queued=false,resolved=false,importType='xml',preferredQuality='FLAC',toastTimer;
const pendingCount=()=>2+tracks.filter(t=>['pending','downloading'].includes(state(t))).length;
const reviewCount=()=>tracks.filter(t=>state(t)==='review').length;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function cover(n=0,extra=''){
 let shapes='';
 if(n===9)shapes='<rect width="240" height="240" fill="var(--art-blue)"/><circle cx="178" cy="57" r="34" fill="var(--art-pink)"/><path d="M0 240 120 112 240 240" fill="var(--art-dark)"/><path d="m119 125-3 27m-2 13-4 40m-2 16-2 19" stroke="var(--art-white)" stroke-width="3"/><path d="M0 158h63m114 0h63M0 178h43m154 0h43" stroke="var(--art-pink)" stroke-width="2"/><text x="17" y="41" fill="var(--art-white)" font-size="25" font-family="Trebuchet MS,sans-serif" font-weight="bold" letter-spacing="-1">NIGHT DRIVE</text><text x="18" y="59" fill="var(--art-white)" font-size="8" font-family="sans-serif" letter-spacing="2">A PLAYLIST FOR THE WAY HOME</text>';
 else if(n%6===0)shapes='<rect width="240" height="240" fill="var(--art-white)"/><path d="m0 165 55-95 20 48 48-75 51 75 20-30 46 77v75H0" fill="var(--art-blue)"/><path d="m0 194 64-50 37 33 40-71 99 85v49H0" fill="var(--art-dark)"/><circle cx="176" cy="47" r="17" fill="var(--art-red)"/>';
 else if(n%6===1)shapes='<rect width="240" height="240" fill="var(--art-dark)"/><circle cx="120" cy="113" r="77" fill="none" stroke="var(--art-yellow)" stroke-width="3"/><path d="M43 110h154M120 36v154M60 66l121 99M60 165 181 66" stroke="var(--art-yellow)" stroke-width="2"/><circle cx="120" cy="113" r="49" fill="var(--art-dark)"/><text x="120" y="113" text-anchor="middle" fill="var(--art-white)" font-size="15" font-family="sans-serif">AFTER HOURS</text><text x="120" y="132" text-anchor="middle" fill="var(--art-yellow)" font-size="8" font-family="sans-serif" letter-spacing="2">ELECTRONIC RECORDINGS</text>';
 else if(n%6===2)shapes='<rect width="240" height="240" fill="var(--art-purple)"/><circle cx="120" cy="117" r="72" fill="var(--art-pink)"/><path d="M0 173h240v67H0" fill="var(--art-dark)"/><path d="M0 182h240M0 196h240M0 215h240" stroke="var(--art-pink)" stroke-width="2"/><path d="m120 174-45 66m45-66 45 66" stroke="var(--art-pink)" stroke-width="2"/>';
 else if(n%6===3)shapes='<rect width="240" height="240" fill="var(--art-green)"/><path d="m25 166 43-94 48 114 47-141 54 128" fill="none" stroke="var(--art-white)" stroke-width="6"/><circle cx="169" cy="68" r="29" fill="var(--art-dark)"/><path d="M27 211h186" stroke="var(--art-yellow)" stroke-width="2"/>';
 else if(n%6===4)shapes='<rect width="240" height="240" fill="var(--art-pink)"/><path d="M0 25h240M0 65h240M0 105h240M0 145h240M0 185h240M0 225h240" stroke="var(--art-purple)" stroke-width="15"/><ellipse cx="120" cy="118" rx="50" ry="89" fill="var(--art-dark)"/>';
 else shapes='<rect width="240" height="240" fill="var(--art-yellow)"/><rect x="28" y="28" width="184" height="184" fill="var(--art-red)"/><circle cx="120" cy="120" r="75" fill="var(--art-dark)"/><circle cx="120" cy="120" r="28" fill="var(--art-yellow)"/><circle cx="120" cy="120" r="4" fill="var(--art-dark)"/>';
 return `<span class="cover ${extra}" role="img" aria-label="Illustrative ${n===9?'Night Drive playlist':'album'} artwork"><svg viewBox="0 0 240 240" aria-hidden="true">${shapes}</svg></span>`;
}
function state(t){return t.id===4&&resolved?(queued?'downloading':'pending'):t.state==='pending'&&queued?'downloading':t.state}
function badge(t){let s=state(t),label={owned:'In library',pending:'To download',review:'Review match',downloading:'Downloading'}[s];return `<span class="badge ${s==='downloading'?'pending':s}">${label}</span>`}
function nav(active='Playlists',side=false){return ['Search','Playlists','Downloads','Artists'].map((n,i)=>`<button class="navitem ${n===active?'current':''}" data-action="${n.toLowerCase()}" ${n===active?'aria-current="page"':''}>${side?ico(['search','playlist','download','artists'][i]):''}${n}</button>`).join('')}
function logo(simple=false){return `<div class="wordmark">${simple?'':`<span class="mark">${ico('playlist')}</span>`}ZenSync</div>`}
const connected=()=>`<span class="pill"><i class="dot"></i> Navidrome connected</span>`;
function searchBox(placeholder='Find a track'){return `<label class="searchbox">${ico('search')}<input aria-label="${placeholder}" data-search placeholder="${placeholder}" value="${esc(query)}"></label>`}
function coverage(){return '<div class="coverage" aria-label="18 in library, 4 to download, 2 need review"><i class="owned"></i><i class="pending"></i><i class="review"></i></div><div class="legend"><span><b>18</b> in library</span><span><b>'+pendingCount()+'</b> to download</span><span><b>'+reviewCount()+'</b> need review</span></div>'}
function visible(){return tracks.filter(t=>(filter==='all'||state(t)===filter||(filter==='pending'&&state(t)==='downloading'))&&`${t.title} ${t.artist} ${t.album}`.toLowerCase().includes(query.toLowerCase()))}
function row(t,number=false){return `<button class="track-row row-button" data-action="inspect" data-track="${t.id}">${number?`<span class="track-number">${String(t.id).padStart(2,'0')}</span>`:cover(t.art,'mini')}<span class="track-main"><strong>${esc(t.title)}</strong><small>${esc(t.artist)}</small></span>${badge(t)}<span class="track-time">${t.time}</span></button>`}
function rows(list=visible(),number=false){return list.length?list.map(t=>row(t,number)).join(''):'<div class="empty">No sample tracks match. Try another search.</div>'}
function collection(){return `<div class="collection-layout"><aside class="sidebar">${logo(true)}${nav('Playlists',true)}<div class="side-status"><i class="dot"></i> Navidrome ready<br><span class="muted">Music library connected</span><button class="btn quiet tiny" data-action="settings">${ico('settings')} Settings</button></div></aside><div class="collection-main"><div class="flex between"><span class="breadcrumb">Playlists / Imported from Apple Music</span><button class="btn quiet tiny" data-action="import">${ico('plus')} Import</button></div><div class="collection-hero">${cover(9)}<div><span class="pill">Apple Music XML</span><h1>Night Drive</h1><p>24 tracks for the way home.</p><p style="margin-top:6px">Last imported today at 18:42</p></div></div><div class="gap">${coverage()}</div><div class="flex between gap"><h2>Inside this playlist</h2>${searchBox('Find music')}</div><div class="albums">${[{art:0,name:'Kid A',artist:'Radiohead'},{art:1,name:'Random Access Memories',artist:'Daft Punk'},{art:2,name:'Hurry Up, We’re Dreaming',artist:'M83'},{art:3,name:'Mezzanine',artist:'Massive Attack'}].map((a,i)=>`<button class="album-button" data-action="inspect" data-track="${i+1}">${cover(a.art,'rounded')}<div class="album-title">${a.name}</div><div class="album-sub">${a.artist}</div></button>`).join('')}</div><div class="gap-sm" data-list>${rows(visible().filter(t=>state(t)!=='owned').slice(0,2))}</div><div class="collection-action"><div><h3>${queued?'Downloads started':'Bring the missing music home'}</h3><p>${queued?'We’ll sync after your downloads are imported.':'Download '+pendingCount()+' matched tracks. Review the other '+reviewCount()+' separately.'}</p></div><button class="btn primary" data-action="queue">${ico('download')}${queued?'View queue':'Download '+pendingCount()}</button></div></div></div>`}
function workbench(){let t=tracks.find(t=>t.id===selected);return `<div class="workbench"><div class="topbar">${logo()}<div class="topnav">${nav()}</div><div class="spacer"></div><button class="btn quiet tiny" data-action="settings" aria-label="Settings">${ico('settings')}</button></div><div class="workbench-head"><div class="flex between"><div><span class="breadcrumb">Apple Music / Library.xml</span><h1>Night Drive</h1><p class="summaryline">24 tracks · 18 in library · ${pendingCount()} downloads · ${reviewCount()} need review</p></div><button class="btn outline" data-action="import">${ico('file')} Import XML</button></div></div><div class="workbench-layout"><div class="table-zone"><div class="table-tools">${searchBox('Filter tracks')}<button class="btn tiny outline" data-action="filter" data-filter="review">Review only</button></div><div class="table-head"><span></span><span>Track / Artist</span><span>Status</span><span>Time</span></div><div data-list>${visible().length?visible().map(t=>`<button class="table-row ${selected===t.id?'selected':''}" data-action="select" data-track="${t.id}"><span class="check">${selected===t.id?'✓':''}</span><span class="track-main"><strong>${t.title}</strong><small>${t.artist}</small></span>${badge(t)}<span class="track-time">${t.time}</span></button>`).join(''):'<div class="empty">No matching sample tracks.</div>'}</div></div><aside class="inspector"><span class="small muted inspector-label">Selected track</span>${cover(t.art)}<div><h3>${t.title}</h3><p>${t.artist}<br>${t.album}</p></div><dl><dt>Imported length</dt><dd>${t.time}</dd><dt>Search provider</dt><dd>Deezer</dd><dt>Version</dt><dd>${state(t)==='review'?'Needs review':'Original'}</dd></dl><div class="notice small inspector-label">${state(t)==='review'?'An alternate release was found. Compare it before downloading.':'Track details are linked to this playlist entry.'}</div><button class="btn primary" data-action="inspect" data-track="${t.id}">${state(t)==='review'?'Compare matches':'View track details'}</button></aside></div><div class="workbench-foot"><span class="muted">6 of 24 sample tracks shown</span><button class="btn primary" data-action="queue">${queued?'View downloads':'Download '+pendingCount()+' matched tracks'}</button></div></div>`}
function mixtape(){return `<div class="mixtape"><div class="topbar">${logo(true)}<div class="spacer"></div><div class="topnav">${nav()}</div><button class="btn quiet tiny" data-action="import" aria-label="Import playlist">${ico('plus')}</button></div><div class="mixtape-main"><div class="sleeve-block"><div class="sleeve">${cover(9)}</div><div class="sleeve-caption"><strong>Your music.<br>Your way home.</strong><p style="margin-top:12px">Imported from Apple Music<br>24 tracks · 1 hr 48 min<br>Updated today</p><button class="btn outline tiny gap-sm" data-action="import">Replace XML file</button></div></div><div><div class="flex between"><span class="small muted">A playlist from your library</span><span class="pill text-success">18 already yours</span></div><h1 class="mixtape-title">Night Drive</h1><p class="small muted">Late trains, empty roads, one more song.</p>${searchBox('Find a track in this playlist')}<div data-list>${rows(visible(),true)}</div></div></div><div class="mixtape-bottom"><div><h3>${reviewCount()===0?'Every recording is matched.':reviewCount()===1?'One match left to review.':'Two tracks, one decision each.'}</h3><p>Keep the original recordings in your playlist.</p></div><button class="btn outline" data-action="inspect" data-track="4">Review matches</button><button class="btn primary" data-action="queue">${queued?'View queue':'Download '+pendingCount()}</button></div></div>`}
function signal(){let review=tracks.filter(t=>state(t)==='review'),pending=tracks.filter(t=>['pending','downloading'].includes(state(t))),owned=tracks.filter(t=>state(t)==='owned');return `<div class="signal"><div class="topbar">${logo()}<div class="spacer"></div><div class="topnav">${nav('Downloads')}</div></div><div class="signal-main"><div class="signal-head"><div><span class="breadcrumb">Night Drive / Apple Music XML</span><h1 class="gap-sm">From playlist to library.</h1><p>Resolve the matches. We’ll handle the rest.</p></div><button class="btn primary" data-action="queue">${queued?'View transfers':'Start downloads'}</button></div><div class="signal-toolbar">${searchBox('Find a sample track')}<div class="spacer"></div><button class="btn outline tiny" data-action="import">${ico('plus')} Add playlist</button></div><div class="board"><section class="column"><div class="column-head">Needs review <span>${reviewCount()}</span></div>${review.filter(t=>`${t.title} ${t.artist}`.toLowerCase().includes(query.toLowerCase())).map(t=>`<div class="job">${cover(t.art)}<h3>${t.title}</h3><small>${t.artist}</small><small class="text-warning">Check release version</small><button class="btn outline" data-action="inspect" data-track="${t.id}">Compare matches</button></div>`).join('')}</section><section class="column"><div class="column-head">${queued?'Downloading':'Ready to download'} <span>${pendingCount()}</span></div>${pending.filter(t=>`${t.title} ${t.artist}`.toLowerCase().includes(query.toLowerCase())).map(t=>`<div class="job">${cover(t.art)}<h3>${t.title}</h3><small>${t.artist}</small>${queued?'<div class="progress"><i></i></div><small>42% · Sample progress</small>':`<small>FLAC · Exact match</small><button class="btn" data-action="queue">Download track</button>`}</div>`).join('')}</section><section class="column"><div class="column-head">In library <span>18</span></div><div class="ready-stack"><div class="text-success small">✓ Ready on Navidrome</div>${owned.filter(t=>`${t.title} ${t.artist}`.toLowerCase().includes(query.toLowerCase())).map(t=>`<div class="track-row">${cover(t.art,'mini')}<div class="track-main"><strong>${t.title}</strong><small>${t.artist}</small></div></div>`).join('')}<div class="muted small gap-sm">16 more tracks in your library</div></div></section></div><div class="destination">${ico('server')}<div><h3>Destination: Navidrome</h3><p>After import, add new tracks to Night Drive.</p></div><button class="btn outline tiny" data-action="sync">Sync 18 available</button></div></div></div>`}
function pocket(){return `<div class="pocket"><div class="topbar">${logo(true)}<div class="spacer"></div><span class="small text-success"><i class="dot"></i> Library ready</span><button class="btn quiet tiny" data-action="import" aria-label="Import music">${ico('plus')}</button></div><div class="pocket-layout"><div><div class="pocket-title">${cover(9)}<div><h1>Night Drive</h1><small>Apple Music XML · 24 tracks</small></div></div><div class="segments" aria-label="Track filters">${[['all','All tracks'],['review','Review '+reviewCount()],['pending','Downloads '+pendingCount()]].map(([v,n])=>`<button class="${filter===v?'active':''}" data-action="filter" data-filter="${v}" aria-pressed="${filter===v}">${n}</button>`).join('')}</div>${searchBox('Find a track')}<div data-list>${rows()}</div><button class="btn primary gap" style="width:100%;min-height:43px;border-radius:12px" data-action="queue">${ico('download')}${queued?'View downloads':'Download '+pendingCount()+' matched tracks'}</button></div><aside class="detail-sheet"><div class="sheet-handle"></div><span class="small text-warning">${resolved?'Match confirmed':'Match needs a look'}</span>${cover(3)}<h2>Teardrop</h2><p>Massive Attack<br>Mezzanine</p><div class="notice">The search found two releases. Choose the recording you want to keep.</div><button class="btn primary" data-action="inspect" data-track="4">${resolved?'View confirmed track':'Compare matches'}</button><button class="btn outline" data-action="skip">Decide later</button><p style="margin:17px 0 0;font-size:10px">Your other downloads can continue.</p></aside></div><nav class="bottom-nav">${['Search','Playlists','Downloads','Settings'].map((n,i)=>`<button class="${n==='Playlists'?'current':''}" data-action="${n.toLowerCase()}">${ico(['search','playlist','download','settings'][i])}${n}</button>`).join('')}</nav></div>`}
const renders={collection,workbench,mixtape,signal,pocket};
function render(){document.documentElement.dataset.mode=current;document.querySelector('#chooser').innerHTML=concepts.map((c,i)=>`<button role="tab" aria-selected="${c.id===current}" aria-controls="app" class="choice" data-action="concept" data-id="${c.id}">${i+1}. ${c.name}<span>${c.short}</span></button>`).join('');let c=concepts.find(c=>c.id===current);document.querySelector('#concept-note').innerHTML=`<strong>${c.name}</strong><p>${c.desc}</p>`;document.querySelector('#app').innerHTML=renders[current]();document.querySelector('#app').setAttribute('aria-label',c.name+' UI mockup')}
function notify(message){clearTimeout(toastTimer);let t=document.querySelector('#toast');t.textContent=message;t.hidden=false;toastTimer=setTimeout(()=>t.hidden=true,4500)}
function openModal(title,body,foot=''){document.querySelector('#modal-title').textContent=title;document.querySelector('#modal-body').innerHTML=body;document.querySelector('#modal-foot').innerHTML=foot;let d=document.querySelector('#modal');if(!d.open)d.showModal()}
const close=()=>document.querySelector('#modal').close();
function importDialog(){openModal('Import your music',`<p>Bring a playlist or library snapshot into ZenSync.</p><div class="segments"><button class="${importType==='xml'?'active':''}" data-action="import-tab" data-type="xml">Apple Music XML</button><button class="${importType==='link'?'active':''}" data-action="import-tab" data-type="link">Public playlist link</button><button class="${importType==='file'?'active':''}" data-action="import-tab" data-type="file">Other file</button></div>${importType==='link'?'<label class="field" for="sample-url">Apple Music playlist URL</label><input class="text" id="sample-url" value="https://music.apple.com/us/playlist/night-drive/pl.sample"><div class="notice">Public playlists only. No Apple login needed.</div>':`<div class="dropzone">${ico('file')}<h3 class="gap-sm">${importType==='xml'?'Library.xml':'Night Drive.csv'}</h3><p>${importType==='xml'?'Apple Music library or playlist export':'CSV, TSV, TXT, M3U or M3U8'}</p><span class="pill gap-sm">Sample file for this mockup</span></div><p>Select playlists after previewing the file. We won’t download your entire library.</p>`}<div class="notice">Demo only: this previews sample data and does not read a file or fetch a URL.</div>`,`<button class="btn outline" data-action="close">Cancel</button><button class="btn primary" data-action="import-preview">Preview sample import</button>`)}
function importPreview(){openModal('Choose playlists to import','<p>Library.xml · 312 music tracks · 3 playlists</p><label class="option"><input type="checkbox" checked><span>Night Drive<small>24 tracks · 18 in library · 4 downloads · 2 matches to review</small></span></label><label class="option"><input type="checkbox"><span>Sunday Morning<small>36 tracks · Playlist order preserved</small></span></label><label class="option"><input type="checkbox"><span>Work, quietly<small>52 tracks · Playlist order preserved</small></span></label><div class="notice">Import creates playlists for review. Downloads start only when you choose them.</div>','<button class="btn outline" data-action="import">Back</button><button class="btn primary" data-action="import-done">Import selected playlists</button>')}
function inspect(id){let t=tracks.find(t=>t.id===Number(id))||tracks[3];selected=t.id;if(state(t)==='review'){openModal('Choose the right recording',`<div class="flex">${cover(t.art,'mini')}<div><h3>${t.title}</h3><p class="muted small">${t.artist} · Imported length ${t.time}</p></div></div><p class="muted gap-sm">Compare the release and duration before downloading.</p><label class="option"><input type="radio" name="match" value="original" checked><span>Original album recording<small>${t.album} · ${t.time} · Deezer</small></span></label><label class="option"><input type="radio" name="match" value="alternate"><span>Alternate release<small>Anniversary edition · ${t.time} · Deezer</small></span></label><div class="notice">Your choice is saved for this playlist entry. Other tracks are unchanged.</div>`,`<button class="btn outline" data-action="close">Decide later</button><button class="btn primary" data-action="match-save" data-track="${t.id}">Use selected match</button>`)}else{openModal(t.title,`<div class="flex">${cover(t.art,'mini')}<div><h3>${t.artist}</h3><p class="muted small">${t.album} · ${t.time}</p></div></div><div class="notice">${state(t)==='owned'?'This recording is already in your Navidrome library.':queued?'A sample download is running. No real files are being transferred.':'Matched to Deezer. Ready to download in FLAC.'}</div><p>Playlist: Night Drive<br>Source: Apple Music XML</p>`,`<button class="btn outline" data-action="close">Close</button>${state(t)!=='owned'?'<button class="btn primary" data-action="queue">Download track</button>':''}`)}}
function downloads(){openModal('Downloads',`<p>${queued?'Sample transfers in progress.':'Matched tracks are ready to download.'} Downloads are imported before the playlist syncs.</p>${tracks.filter(t=>['pending','downloading'].includes(state(t))).map(t=>`<div class="track-row">${cover(t.art,'mini')}<div class="track-main"><strong>${t.title}</strong><small>${t.artist}</small></div><span class="badge pending">${queued?'42%':'Queued'}</span></div>`).join('')}<div class="notice">Navidrome scan and playlist sync follow completed imports. Progress here is simulated.</div>`,`<button class="btn outline" data-action="close">Close</button><button class="btn primary" data-action="${queued?'cancel-demo':'start-demo'}">${queued?'Cancel sample downloads':'Start sample downloads'}</button>`)}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;
if(a==='concept'){current=b.dataset.id;query='';filter='all';render();return}
if(a==='close'){close();return}
if(a==='import'){importDialog();return}
if(a==='import-tab'){importType=b.dataset.type;importDialog();return}
if(a==='import-preview'){importPreview();return}
if(a==='import-done'){let count=document.querySelectorAll('#modal input[type=checkbox]:checked').length;if(!count){notify('Select at least one sample playlist.');return}close();notify(`Demo: ${count} playlist${count===1?'':'s'} imported. No downloads started.`);return}
if(a==='inspect'){inspect(b.dataset.track);return}
if(a==='select'){selected=Number(b.dataset.track);render();return}
if(a==='match-save'){let id=Number(b.dataset.track);if(id===4)resolved=true;else tracks.find(t=>t.id===id).state='pending';close();render();notify('Demo: match saved. The recording is now ready to download.');return}
if(a==='filter'){let f=b.dataset.filter;filter=filter===f?'all':f;render();return}
if(a==='queue'){if(queued){downloads();return}queued=true;close();render();notify('Demo: '+pendingCount()+' matched tracks queued. No real downloads started.');return}
if(a==='downloads'){downloads();return}
if(a==='start-demo'||a==='cancel-demo'){queued=a==='start-demo';close();render();notify(queued?'Demo: downloads started.':'Demo: sample downloads cancelled.');return}
if(a==='sync'){notify('Demo: 18 available tracks synced to Night Drive.');return}
if(a==='skip'){notify('Match left for later. Other downloads can continue.');return}
if(a==='search'){openModal('Search music',`<p>Search Apple Music and Deezer. Sample results are shown below.</p><label class="field" for="catalog-query">Artist, album or track</label><input class="text" id="catalog-query" value="Massive Attack"><label class="field" for="provider">Metadata source</label><select id="provider"><option>Deezer</option><option>Apple Music</option></select><div id="catalog-results">${rows(tracks.filter(t=>t.artist==='Massive Attack'))}</div>`,'<button class="btn outline" data-action="close">Close</button><button class="btn primary" data-action="catalog-search">Search sample catalog</button>');return}
if(a==='catalog-search'){let q=document.querySelector('#catalog-query').value.toLowerCase();document.querySelector('#catalog-results').innerHTML=rows(tracks.filter(t=>`${t.title} ${t.artist} ${t.album}`.toLowerCase().includes(q)));return}
if(a==='playlists'){openModal('Your playlists','<p>Imported playlists stay separate from your downloaded music.</p>'+[{n:'Night Drive',s:'24 tracks · Apple Music XML',a:9},{n:'Sunday Morning',s:'36 tracks · Apple Music link',a:5},{n:'Work, quietly',s:'52 tracks · CSV file',a:4}].map(p=>`<button class="track-row row-button" data-action="open-playlist">${cover(p.a,'mini')}<span class="track-main"><strong>${p.n}</strong><small>${p.s}</small></span>${ico('arrow')}</button>`).join(''),'<button class="btn primary" data-action="import">Import a playlist</button>');return}
if(a==='open-playlist'){close();notify('This mockup opens Night Drive as the sample playlist.');return}
if(a==='artists'){openModal('Artists you follow','<p>Check these artists for releases missing from your library. No recommendations are generated.</p>'+['Radiohead','Massive Attack','James Blake'].map((n,i)=>`<div class="track-row">${cover(i,'mini')}<div class="track-main"><strong>${n}</strong><small>Followed · Last checked today</small></div><span class="badge owned">Up to date</span></div>`).join(''),'<button class="btn outline" data-action="close">Close</button><button class="btn primary" data-action="scan">Check for releases</button>');return}
if(a==='scan'){notify('Demo: followed artists checked. No missing releases found.');return}
if(a==='settings'){openModal('Connections & quality','<p>Connection values below are illustrative.</p><div class="track-row">'+ico('server')+'<div class="track-main"><strong>Navidrome</strong><small>Music library and playlists</small></div><span class="badge owned">Connected</span></div><div class="track-row">'+ico('download')+'<div class="track-main"><strong>Deezer</strong><small>Download account</small></div><span class="badge owned">Ready</span></div><div class="track-row"><div class="track-main"><strong>Wavio</strong><small>Compatible connection available</small></div><span class="badge owned">Ready</span></div><label class="field" for="quality">Preferred download quality</label><select id="quality"><option>FLAC</option><option>MP3 320</option></select><div class="notice">Demo settings only. No credentials are stored.</div>','<button class="btn primary" data-action="settings-save">Save demo settings</button>');document.querySelector('#quality').value=preferredQuality;return}
if(a==='settings-save'){preferredQuality=document.querySelector('#quality').value;close();notify('Demo settings saved for this preview.');return}
});
document.addEventListener('input',e=>{if(!e.target.matches('[data-search]'))return;query=e.target.value;let pos=e.target.selectionStart;render();let input=document.querySelector('[data-search]');input.focus();input.setSelectionRange(pos,pos)});
document.querySelector('#chooser').addEventListener('keydown',e=>{if(!['ArrowRight','ArrowLeft','Home','End'].includes(e.key))return;e.preventDefault();let i=concepts.findIndex(c=>c.id===current);i=e.key==='Home'?0:e.key==='End'?4:(i+(e.key==='ArrowRight'?1:4))%5;current=concepts[i].id;filter='all';query='';render();document.querySelector('[aria-selected=true]').focus()});
document.querySelector('#modal').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close()}});
if(location.protocol==='file:'){document.body.style.background='var(--background)';document.body.style.padding='24px';document.documentElement.style.setProperty('--chrome-foreground','var(--foreground)');document.documentElement.style.setProperty('--chrome-muted','var(--muted-foreground)')}
let initial=new URLSearchParams(location.search).get('concept');if(concepts.some(c=>c.id===initial))current=initial;render();
</script></body></html>
