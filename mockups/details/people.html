ntry become available.</div><div class="page-actions"><button class="btn outline" data-action="cancel-task" data-id="${t.id}">Cancel sample task</button><button class="btn primary" data-action="complete" data-id="${t.song}">Simulate completed import</button></div>`:''}`}
function importsPage(){topbar('Sources','Imports');return intro('Imports','Your source libraries, playlists and import history.',link('/imports/new',ico('plus')+' New import','btn primary'))+link('/imports/sample',`<span class="task-icon">${ico('file')}</span><div><h3>Library.xml</h3><p class="task-sub">Apple Music · 12 songs · 3 playlists</p><p class="task-sub">Includes 2 songs outside all playlists</p></div><span class="badge available">Catalog saved</span><span>${ico('arrow')}</span>`,'activity-row')+`<div class="notice mt">An XML export contains your full song catalog and playlist memberships. Importing it saves metadata; downloading music is a separate action.</div>`}

function importPreview(){let xml=(params().get('source')||'xml')==='xml';topbar('Imports','Preview '+(xml?'Library.xml':'playlist'));return `<div class="steps"><span>1. Choose source</span><span class="active">2. Preview</span><span>3. Import</span></div>`+intro(xml?'Your whole library, intact.':'Preview your playlist',xml?'Save every music record and choose which playlists to bring with it.':'Keep the source song order and review unavailable tracks afterwards.')+`<div class="import-stats"><div><strong>${xml?12:8}</strong><span>Music songs</span></div><div><strong>${xml?3:1}</strong><span>Playlists found</span></div><div><strong>${xml?2:0}</strong><span>Songs outside playlists</span></div></div>${xml?'<div class="notice"><strong>All 12 songs will enter your catalog.</strong><br>This includes Dayvan Cowboy and Two Weeks, which belong to no playlist. Deselecting a playlist does not discard its songs.</div>':''}<div class="section-head"><h2>Playlist memberships</h2><span>Original order preserved</span></div>${(xml?playlists:[playlists[0]]).map(p=>`<label class="import-choice"><input type="checkbox" data-playlist="${p.id}" ${model.selectedPlaylists.includes(p.id)?'checked':''}>${cover(p.art)}<span><strong>${p.name}</strong><small>${p.ids.length} song references${p.id==='night-drive'?' · 2 need attention':''}</small></span><span class="badge deferred">Metadata only</span></label>`).join('')}<div class="notice mt"><strong>Unresolved songs won’t block the import.</strong><br>Their playlist positions stay reserved. Resolve them now, later, or skip them for now.</div><div class="page-actions">${link('/imports/new',ico('back')+' Back','btn outline')}<span class="muted">Nothing will download yet.</span><button class="btn primary" data-action="import">${xml?'Import library':'Import playlist'}</button></div>`}
function importResult(){if(model.lastImportSource&&model.lastImportSource!=='xml'){topbar('Imports','Night Drive');return intro('Night Drive imported','Eight ordered song references saved. No downloads started.')+'<div class="notice">This source contains one playlist. It does not describe your complete Apple Music library.</div><ul class="summary-checks"><li>'+ico('check')+'8 songs retained in source order</li><li>'+ico('check')+'Unresolved entries kept as placeholders</li></ul><div class="page-actions">'+link('/imports/new','Import another source','btn outline')+link('/playlists/night-drive','Open playlist','btn primary')+'</div>'}topbar('Imports','Library.xml');return intro('Library.xml','Your source catalog is saved. Matching continues separately.',link('/imports/new','Re-import XML','btn outline'))+`<div class="notice"><strong class="green">Catalog import complete</strong><br>Metadata saved. No downloads were started by this import.</div><ul class="summary-checks"><li>${ico('check')}All 12 music songs retained in your catalog</li><li>${ico('check')}${model.selectedPlaylists.length} playlists selected, with ordered song references</li><li>${ico('check')}2 songs outside playlists are still included</li><li>${ico('check')}Unresolved entries kept as placeholders</li></ul><div class="section-head"><h2>Choose what happens next</h2></div><div class="choice-row"><div><h3>Review Night Drive</h3><p>Skip unresolved songs or choose a match.</p></div>${link('/playlists/night-drive','Open playlist','btn outline')}</div><div class="choice-row"><div><h3>See the full song catalog</h3><p>Available and not-yet-downloaded music together.</p></div>${link('/library/songs','Open library','btn outline')}</div><div class="choice-row"><div><h3>Check server work</h3><p>Downloads, metadata lookups and song imports.</p></div>${link('/activity','View activity','btn outline')}</div><p class="footer-note mt">Re-import updates this source snapshot. Existing files are not deleted.</p>`}
function reviewPage(id){let s=song(id);if(!s)return notFound();let failed=s.id===5,def=state(s)==='deferred';topbar('Review',s.title);return link('/playlists/night-drive',ico('back')+' Back to Night Drive','btn quiet compact')+intro(failed?'Keep the match. Retry the import.':'Keep the right recording.',failed?'The recording was identified. A file import error should not make you match it again.':'Choose a recording when you’re ready. The rest of the playlist can continue.')+`<div class="review-layout"><aside class="original-record"><span class="small muted">Original XML entry</span>${cover(s.art)}<h3>${s.title}</h3><p>${s.artist}<br>${s.album}<br>${s.time}</p><div class="placeholder-example">Night Drive<br><b>Position ${s.id===2?'02':'05'} is reserved</b></div></aside><section>${failed?`<h2>Import couldn’t finish</h2><div class="notice warn"><strong>Could not write album artwork.</strong><br>The staged audio file and chosen metadata are retained. Retry this stage or skip it for now.</div><div class="detail-panel"><dl><dt>Match</dt><dd>Original album recording</dd><dt>File</dt><dd>Validated FLAC</dd><dt>Failed stage</dt><dd>Writing artwork</dd></dl></div>`:`<h2>Possible recordings</h2><p class="subtitle">Compare release details with the original entry.</p><label class="candidate"><div class="flex"><input type="radio" name="candidate" value="original" ${model.selectedCandidate==='original'?'checked':''}><div><h3>Teardrop</h3><p>Massive Attack · Mezzanine<br>Original album · 5:30 · Deezer</p><div class="evidence">Title, artist and duration agree</div></div></div></label><label class="candidate"><div class="flex"><input type="radio" name="candidate" value="alternate" ${model.selectedCandidate==='alternate'?'checked':''}><div><h3>Teardrop</h3><p>Massive Attack · Mezzanine<br>Anniversary release · 5:31 · Deezer</p><div class="small muted mt-sm">Different release edition</div></div></div></label>`}<div class="notice"><strong>${def?'You skipped this for now.':'You don’t need to decide now.'}</strong><br>Skipping keeps the original playlist entry. It won’t retry until you resume or accept a match.</div></section></div><div class="page-actions"><button class="btn outline" data-action="skip-back" data-id="${s.id}">Skip for now</button><span class="muted">Other songs continue.</span><button class="btn primary" data-action="${failed?'retry-import':'resolve'}" data-id="${s.id}">${failed?'Retry file import':'Use match & continue'}</button></div>`}
function searchPage(){topbar('Music','Search');let q=params().get('q')||'',source=params().get('source')||'deezer';let arr=songs.filter(s=>`${s.title} ${s.artist} ${s.album}`.toLowerCase().includes(q.toLowerCase()));return intro('Find your music','Search metadata, then choose what to add to your library.')+`<form id="catalog-form"><div class="toolbar"><label class="searchbox">${ico('search')}<input id="catalog-q" name="q" value="${esc(q)}" placeholder="Artist, album or song" aria-label="Search music"></label><select class="select" id="catalog-source" name="source" aria-label="Metadata source"><option value="deezer" ${source==='deezer'?'selected':''}>Deezer</option><option value="itunes" ${source==='itunes'?'selected':''}>Apple Music</option></select><button class="btn primary" type="submit">Search</button></div></form><div class="section-head"><h2>${q?'Results for “'+esc(q)+'”':'Sample catalog'}</h2><span>${arr.length} songs</span></div>${arr.map(libraryRow).join('')||'<div class="empty">No sample results. Try Radiohead or Massive Attack.</div>'}<p class="footer-note mt">This prototype filters sample data instead of contacting music providers.</p>`}
function followedPage(){topbar('Music','Followed artists');return intro('Followed artists','Check artists you choose for releases missing from your library.','<button class="btn primary" data-action="check-artists">Check releases</button>')+`<div class="artist-grid">${['Radiohead','Massive Attack','James Blake'].map(a=>{let s=songs.find(s=>s.artist===a);return link('/library/artists/'+slug(a),cover(s.art)+`<h3>${a}</h3><p>Following · Checked today</p>`,'artist-card')}).join('')}</div>`}
function settingsPage(){topbar('Settings','Connections');return intro('Connections','The services that bring music into your library.')+`<div class="choice-row"><div><h3>Navidrome</h3><p>Your playable library and playlists</p></div><span class="badge available">Connected</span></div><div class="choice-row"><div><h3>Deezer</h3><p>Your download account</p></div><span class="badge available">Ready</span></div><div class="choice-row"><div><h3>Wavio</h3><p>Compatible music requests and artist follows</p></div><span class="badge available">Ready</span></div><label class="inline-field" for="quality">Download quality</label><select class="select" id="quality"><option>FLAC</option><option>MP3 320</option></select><div class="notice mt">All connection states are illustrative. This mockup stores no credentials.</div>`}
function notFound(){topbar('Music','Page not found');return intro('This page isn’t in the sample.','Return to your playlist to continue exploring.',link('/playlists/night-drive','Open Night Drive','btn primary'))}
function render(){let p=path(),parts=p.split('/').filter(Boolean),html;if(p==='/playlists')html=playlistsPage();else if(parts[0]==='playlists')html=playlistPage(playlists.find(p=>p.id===parts[1])||playlists[0]);else if(parts[0]==='library')html=parts[2]?catalogDetail(parts[1],parts[2]):libraryPage(parts[1]);else if(p==='/activity')html=activityPage();else if(parts[0]==='activity')html=taskPage(parts[1]);else if(p==='/imports/new')html=newImportPage();else if(p==='/imports/sample/preview')html=importPreview();else if(p==='/imports/sample')html=importResult();else if(p==='/imports')html=importsPage();else if(parts[0]==='review')html=reviewPage(parts[1]);else if(p==='/search')html=searchPage();else if(p==='/followed-artists')html=followedPage();else if(parts[0]==='settings')html=settingsPage();else html=notFound();document.querySelector('#page').innerHTML=html;sidebar()}
function defer(id,back=false){id=Number(id);if(!model.deferred.includes(id))model.deferred.push(id);save();if(back)go('/playlists/night-drive');else render();notify('Skipped for now. Its playlist position is saved.')}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=Number(b.dataset.id);
if(a==='collapse'){model.collapsed=!model.collapsed;save();sidebar();return}
if(a==='drawer'||a==='drawer-close'){drawer=a==='drawer';sidebar();if(drawer)document.querySelector('.sidebar .brand').focus();else document.querySelector('.mobile-menu').focus();return}
if(a==='favorite'){let i=model.favorites.indexOf(id);if(i===-1)model.favorites.push(id);else model.favorites.splice(i,1);save();render();return}
if(a==='skip'||a==='skip-back'){defer(id,a==='skip-back');return}
if(a==='resolve'||a==='retry-import'){model.states[id]='matched';model.deferred=model.deferred.filter(n=>n!==id);save();go('/activity/'+(id===5?'import-5':'resolve-'+id));notify(a==='resolve'?'Match saved. Playlist position stays reserved until import finishes.':'Correct match kept. File import queued again.');return}
if(a==='complete'){model.states[id]='available';model.deferred=model.deferred.filter(n=>n!==id);if(id===4)model.taskOverrides['download-4']='completed';save();let parent=playlists.find(p=>p.ids.includes(id));go(parent?'/playlists/'+parent.id:'/library/songs/'+id);notify(parent?'Demo: song imported and playlist synced in its original position.':'Demo: song imported into the library.');return}
if(a==='cancel-task'){model.taskOverrides[b.dataset.id]='cancelled';save();render();notify('Sample task cancelled. The playlist entry is retained.');return}
if(a==='source'){importSource=b.dataset.source;render();return}
if(a==='import'){model.lastImportSource=params().get('source')||'xml';if(model.lastImportSource!=='xml')model.selectedPlaylists=['night-drive'];model.imported=true;save();go('/imports/sample');notify('Sample catalog imported. No downloads started.');return}
if(a==='download'){model.states[id]='matched';save();go('/activity/resolve-'+id);return}
if(a==='check-artists'){notify('Demo: followed artists checked. No missing releases found.');return}
if(a==='reset'){model=defaultModel();save();query='';libraryFilter='all';go('/playlists/night-drive');notify('Sample reset.');return}
});

 if(!model.members)model.members=[{id:'alex',name:'Alex Morgan',email:'alex@example.test',role:'Admin',direct:true,navidrome:'alex'},{id:'maya',name:'Maya Chen',email:'maya@example.test',role:'Member',direct:false,navidrome:'maya'},{id:'sam',name:'Sam Reed',email:'sam@example.test',role:'Member',direct:false,navidrome:'sam'}];

 if(!model.activityScope)model.activityScope='server';

playlistsPage=function(){topbar('Music','Playlists');let list=playlists.filter(canViewPlaylist);return intro('Playlists','Your collections and playlists shared with you.',link('/imports/new','Import playlist','btn outline'))+`<div class="playlist-cards">${list.map(p=>link('/playlists/'+p.id,cover(p.art,'rounded')+`<h3>${p.name}</h3><p>${p.ids.length} songs · ${displayUser(playlistOwner(p))}</p><p>${playlistShared(p)?'Shared with members':'Private playlist'}${isAdmin()&&playlistOwner(p)!==model.currentUser?' · Admin view':''}</p>`,'music-card')).join('')}</div>`};
function libraryStatus(s){return !isAdmin()&&['review','failed','deferred'].includes(state(s))?'<span class="badge missing">Not downloaded</span>':badge(s)}
function denseSong(s){return `<div class="dense-song ${selectedSongs.includes(s.id)?'selected':''}"><input type="checkbox" data-song-select="${s.id}" aria-label="Select ${esc(s.title)}" ${selectedSongs.includes(s.id)?'checked':''}><div class="title-block">${link(state(s)==='matched'&&tasks().some(t=>t.song===s.id)?'/activity/resolve-'+s.id:isPlaceholder(s)&&isAdmin()?'/review/'+s.id:'/library/songs/'+s.id,s.title,'song-title')}<div class="song-detail">${s.artist}</div></div><span class="album-cell">${s.album}</span>${libraryStatus(s)}${favorite(s)}<span class="duration-cell">${s.time}</span></div>`}
libraryPage=function(view){view=['songs','artists','albums','favorites'].includes(view)?view:'songs';if(['artists','albums'].includes(view))return baseLibrary(view);topbar('Library',view==='favorites'?'Favorites':'Songs');let arr=songs.filter(s=>(view!=='favorites'||model.favorites.includes(s.id))&&`${s.title} ${s.artist} ${s.album}`.toLowerCase().includes(query.toLowerCase())&&(libraryFilter==='all'||(libraryFilter==='available'?state(s)==='available':state(s)!=='available')));return intro(view==='favorites'?'Your favorites':'Shared music library',view==='favorites'?'Saved for you. Other members have their own favorites.':'One music collection. Your playlists and favorites stay personal.',requestButton())+libraryTabs(view)+`<div class="toolbar">${searchbox('Filter songs')}<select class="select" data-select="availability" aria-label="Availability"><option value="all" ${libraryFilter==='all'?'selected':''}>All songs</option><option value="available" ${libraryFilter==='available'?'selected':''}>In library</option><option value="missing" ${libraryFilter==='missing'?'selected':''}>Not available yet</option></select></div><div class="collection-info"><span><strong>${arr.length} songs</strong> · Shared files, personal favorites</span><span>${canAcquire()?'You can add music directly':'New music needs admin approval'}</span></div>${selectedSongs.length?`<div class="bulkbar"><strong>${selectedSongs.length} selected</strong><button class="btn primary compact" data-action="request-selected">${canAcquire()?'Add selected music':'Request selected music'}</button><button class="btn quiet compact" data-action="clear-selection">Clear</button><span class="muted">Existing songs need no download.</span></div>`:''}<div class="dense-head"><input type="checkbox" data-select-all aria-label="Select visible songs" ${arr.length&&arr.every(s=>selectedSongs.includes(s.id))?'checked':''}><span>Song / Artist</span><span class="album-cell">Album</span><span>Availability</span><span>♥</span><span class="duration-cell">Time</span></div><div id="dense-list">${arr.map(denseSong).join('')||'<div class="empty">No songs match this view.</div>'}</div><p class="footer-note mt">Removing a favorite or a playlist entry never deletes a shared music file.</p>`};
tasks=function(){let all=baseTasks();if(isAdmin()&&model.activityScope==='server')return all;const owners={metadata:'alex','import-5':'alex','review-2':'alex',scan:'alex',sync:'alex',xml:'alex','download-4':'maya'};return all.filter(t=>{if(t.id.startsWith('resolve-'))return model.requests.some(r=>r.songId===t.song&&r.userId===model.currentUser&&r.decision==='approved')||model.reviewOwners?.[t.song]===model.currentUser;return owners[t.id]===model.currentUser})};
activityPage=function(){let html=baseActivity();const scope=`<div class="scope-toggle" aria-label="Activity scope"><button class="${model.activityScope==='mine'||!isAdmin()?'active':''}" data-action="scope" data-scope="mine">My work</button>${isAdmin()?`<button class="${model.activityScope==='server'?'active':''}" data-action="scope" data-scope="server">Server overview</button>`:''}</div>`;html=html.replace('<nav class="subnav activity-tabs"',scope+'<nav class="subnav activity-tabs"');html=html.replace('Work happening across your server, including requests from Wavio.',isAdmin()?'Server operations and personal requests, including Wavio.':'Your running and queued work, including approved requests.');html+=`<div class="notice mt">${model.requests.filter(r=>requestVisible(r)&&r.decision==='pending').length} requests await approval. They are not running downloads. ${link('/requests',isAdmin()?'Open approval inbox':'View my requests','rose')}.</div>`;return html};
taskPage=function(id){if(!tasks().some(t=>t.id===id))return accessPage('This activity is not part of your account. Shared recording availability is visible in Library.');let html=baseTaskPage(id);if(!isAdmin()){let h=document.createElement('div');h.innerHTML=html;h.querySelectorAll('[data-action="cancel-task"]').forEach(b=>b.remove());html=h.innerHTML}return html};
importPreview=function(){let html=baseImportPreview();return `<div class="ownership">Import owner: ${displayUser(model.currentUser)} <span class="pill">Private source</span></div>`+html+`<div class="notice mt">${canAcquire()?'Downloading remains an explicit action after import.':'Matching and catalog import can finish now. Missing-music downloads will become requests for admin approval.'} Existing deferred decisions are retained on re-import.</div>`};
function visibleRequests(){return model.requests.filter(requestVisible)}
function reqBadge(r){let stat=requestStatus(r);return `<span class="badge ${r.decision==='pending'?'attention':stat==='Available'?'available':r.decision==='approved'?'working':'deferred'}">${stat}</span>`}
function requestsPage(){topbar(isAdmin()?'Administration':'Music',isAdmin()?'Requests':'My requests');let view=params().get('view')||'pending';let all=visibleRequests(),arr=all.filter(r=>view==='all'||view==='pending'&&r.decision==='pending'||view==='active'&&r.decision==='approved'&&requestStatus(r)!=='Available'||view==='history'&&['Available','Declined','Withdrawn'].includes(requestStatus(r)));return intro(isAdmin()?'Music requests':'Your music requests',isAdmin()?'Review new music before it joins the shared library.':'Ask for music, follow decisions and keep your playlist positions.',isAdmin()?'':requestButton())+`<nav class="subnav"><a href="#/requests?view=pending" class="${view==='pending'?'active':''}">Awaiting approval ${all.filter(r=>r.decision==='pending').length}</a><a href="#/requests?view=active" class="${view==='active'?'active':''}">In progress</a><a href="#/requests?view=history" class="${view==='history'?'active':''}">History</a><a href="#/requests?view=all" class="${view==='all'?'active':''}">All</a></nav>${arr.map(r=>{let s=song(r.songId);return `<div class="request-row">${cover(s.art)}<div>${link('/requests/'+r.id,s.title,'song-title')}<p class="song-detail">${s.artist} · ${r.quality}</p><span class="request-status ${r.decision}">${requestStatus(r)}</span></div><span class="requester">${displayUser(r.userId)}</span><div class="request-actions">${isAdmin()&&r.decision==='pending'?`<button class="btn primary" data-action="approve-request" data-id="${r.id}">Approve</button>${link('/requests/'+r.id,'Review','btn outline')}`:link('/requests/'+r.id,'Details','btn outline')}</div></div>`}).join('')||'<div class="empty">No requests in this view.</div>'}<div class="permission-note">${ico('library')}<span>Approved music becomes available to everyone. Playlists, favorites and source imports stay personal.</span></div>`}
function requestDetail(id){let r=model.requests.find(r=>r.id===id);if(!r||!requestVisible(r))return accessPage('This request is not part of your account.');let s=song(r.songId),others=model.requests.filter(o=>o.songId===r.songId&&o.id!==r.id&&o.decision!=='declined'&&o.decision!=='withdrawn');topbar('Requests',s.title);return link('/requests?view=all',ico('back')+' Back to requests','btn quiet compact')+`<div class="page-intro mt"><div><h1>${s.title}</h1><p>${s.artist} · ${s.album}</p></div>${reqBadge(r)}</div><div class="detail-panel"><dl class="mini-definition"><dt>Requested by</dt><dd>${esc(displayUser(r.userId))}</dd><dt>Quality</dt><dd>${r.quality}</dd><dt>Recording</dt><dd>Original album · ${s.time}</dd><dt>Availability</dt><dd>${state(s)==='available'?'Already in the shared library':'Not available in the shared library yet'}</dd><dt>Submitted</dt><dd>${r.created}</dd><dt>Requester’s note</dt><dd>${esc(r.note||'No note')}</dd></dl></div>${isAdmin()&&others.length?`<div class="notice">${others.length} other request targets this recording. Approved requests share one download; each request keeps its own decision.</div>`:''}<h2 class="mt">Request history</h2><ul class="request-history">${r.events.map(v=>`<li>${esc(v)}<small>Sample audit event</small></li>`).join('')}</ul>${r.decision==='pending'&&isAdmin()?`<label class="inline-field" for="decision-note">Decision note</label><input class="text-input" id="decision-note" placeholder="Required when declining"><div class="page-actions"><button class="btn outline" data-action="decline-request" data-id="${r.id}">Decline request</button><button class="btn primary" data-action="approve-request" data-id="${r.id}">Approve request</button></div>`:r.decision==='pending'?`<div class="notice">An admin will review this recording before downloading. The request does not block other songs.</div><div class="page-actions"><button class="btn outline" data-action="withdraw-request" data-id="${r.id}">Withdraw my request</button>${link('/library/songs','Back to library','btn primary')}</div>`:r.decision==='approved'?`<div class="notice">Approval authorizes acquisition. A song becomes playable only after file import and the Navidrome scan.</div><div class="page-actions">${link('/activity','View my activity','btn primary')}</div>`:`<div class="notice">This decision never deletes shared files or removes a song’s reserved playlist position.</div>`}`}
function newRequestPage(){let id=Number(params().get('song')||9),s=song(id)||song(9);topbar('Requests',canAcquire()?'Add music':'New request');return intro(canAcquire()?'Add music to the shared library':'Request new music',canAcquire()?'This account can add music without waiting for approval.':'An admin reviews your request before any download starts.')+`<form id="music-request-form" class="request-form"><label>Recording<select id="request-song">${songs.filter(s=>state(s)!=='available').map(t=>`<option value="${t.id}" ${t.id===s.id?'selected':''}>${t.artist} — ${t.title}</option>`).join('')}</select></label><label>Preferred quality<select id="request-quality"><option>FLAC</option><option>MP3 320</option></select></label><label>Note for the administrator<textarea id="request-note" placeholder="Playlist or release details, if useful"></textarea></label><div class="notice">The shared library is checked again before acquisition. If the song is already available, no new download is needed.</div><div class="page-actions">${link('/library/songs','Cancel','btn outline')}<button class="btn primary" type="submit">${canAcquire()?'Add music':'Submit request'}</button></div></form><p class="footer-note mt">Sample request only. No real provider or administrator is contacted.</p>`}
function peoplePage(){if(!isAdmin())return accessPage();topbar('Settings','People & permissions');return intro('People & permissions','Shared music. Individual collections. Explicit permissions.',link('/settings/people/invite','Invite member','btn primary'))+`<div class="people-head"><span>Person</span><span>Role</span><span>Add without approval</span><span class="navidrome-link">Navidrome</span></div>${model.members.map(u=>`<div class="person-row"><div class="person-name"><span class="avatar ${u.role==='Admin'?'':'member'}">${initials(u)}</span><div>${link('/settings/people/'+u.id,`<strong>${esc(u.name.split(' ')[0])}</strong>`)}<small>${esc(u.email)}</small></div></div><span class="role">${u.role}</span>${u.role==='Admin'?'<span class="small muted">Allowed by role</span>':`<label class="toggle-label"><input type="checkbox" data-grant="${u.id}" ${u.direct?'checked':''} aria-label="Allow ${esc(u.name)} to add music without approval"><span class="toggle-track"></span><span>${u.direct?'Allowed':'Approval required'}</span></label>`}<span class="navidrome-link">${esc(u.navidrome||'Not linked')}</span></div>`).join('')}<div class="permission-note">${ico('alert')}<span><strong class="rose">Members cannot delete music files.</strong><br>Allowing direct downloads does not grant file deletion, user management or shared service settings.</span></div><div class="detail-panel"><h3>Personal for every account</h3><p class="card-subtitle">Playlists, favorites, XML imports, followed artists and request history.</p><h3 class="mt-sm">Shared across the server</h3><p class="card-subtitle">Available recordings and the downloaded music files.</p></div>`}
function personPage(id){if(!isAdmin())return accessPage();let u=model.members.find(u=>u.id===id);if(!u)return accessPage('This sample user was not found.');topbar('People',u.name);return link('/settings/people',ico('back')+' All people','btn quiet compact')+intro(esc(u.name),esc(u.email))+`<div class="detail-panel"><dl class="mini-definition"><dt>Role</dt><dd>${u.role}</dd><dt>Music requests</dt><dd>${u.role==='Admin'||u.direct?'May add without approval':'Requires administrator approval'}</dd><dt>Delete music files</dt><dd>${u.role==='Admin'?'Administrator only':'Not permitted'}</dd><dt>Collections</dt><dd>Personal playlists, favorites and imports</dd><dt>Navidrome user</dt><dd>${esc(u.navidrome||'Not linked')}</dd></dl></div>${u.role==='Member'?`<div class="choice-row"><div><h3>Add music without approval</h3><p>This does not permit deletion of shared files.</p></div><label class="toggle-label"><input type="checkbox" data-grant="${u.id}" ${u.direct?'checked':''} aria-label="Grant direct music acquisition"><span class="toggle-track"></span><span>${u.direct?'Allowed':'Off'}</span></label></div>`:'<div class="notice">The administrator role can approve requests and manage shared files.</div>'}`}
function invitePage(){if(!isAdmin())return accessPage();topbar('People','Invite member');return intro('Invite a member','New members require approval for music downloads by default.')+`<form id="invite-member-form" class="request-form"><label>Name<input id="invite-name" required placeholder="Member name"></label><label>Email<input id="invite-email" type="email" required placeholder="name@example.test"></label><div class="notice">Sample invitation only. No email is sent. Shared file deletion stays unavailable to this member.</div><div class="page-actions">${link('/settings/people','Cancel','btn outline')}<button class="btn primary" type="submit">Create sample invitation</button></div></form>`}
function accountPage(){topbar('Account','Your access');let u=currentUser();return intro(esc(u.name),'Your account and personal collection.')+`<div class="detail-panel"><dl class="mini-definition"><dt>Role</dt><dd>${u.role}</dd><dt>Music acquisition</dt><dd>${canAcquire()?'May add music directly':'Request administrator approval'}</dd><dt>Delete song files</dt><dd>${isAdmin()?'Admin-only operation':'Not permitted'}</dd><dt>Navidrome</dt><dd>${esc(u.navidrome||'Not linked')}</dd></dl></div>${link('/requests',isAdmin()?'Open approval inbox':'My music requests','btn primary')}`}
function requestMusic(id,quality='FLAC',note=''){let s=song(id);if(!s)return null;if(state(s)==='available'){notify('Already available. No request or download needed.');return null}let existing=model.requests.find(r=>r.songId===id&&r.userId===model.currentUser&&!['declined','withdrawn'].includes(r.decision));let r=existing||{id:String(Math.max(204,...model.requests.map(r=>Number(r.id)))+1),songId:id,userId:model.currentUser,decision:'pending',quality,note,created:'Just now',events:[displayUser(model.currentUser)+' submitted a music request.']};if(existing&&existing.decision==='approved')return existing;if(!existing)model.requests.push(r);if(canAcquire()){r.decision='approved';r.approvalKind=isAdmin()?'admin':'permission';r.events.push(isAdmin()?'Approved by administrator '+displayUser(model.currentUser)+'.':'Allowed without approval by current permission.');if(!['review','failed','deferred'].includes(state(s)))model.states[id]='matched';else r.events.push('Recording/import needs review before acquisition can continue.')}save();return r}
function approveRequest(id){if(!isAdmin()){notify('Only administrators can approve requests.');return}let r=model.requests.find(r=>r.id===id);if(!r||r.decision!=='pending')return;if(['review','deferred'].includes(state(song(r.songId)))){notify('Review the recording before approving acquisition.');return}r.decision='approved';r.approvalKind='admin';r.events.push(displayUser(model.currentUser)+' approved this recording.');if(state(song(r.songId))!=='available')model.states[r.songId]='matched';save();render();notify('Request approved. A shared acquisition is queued, not completed.')}
function previewChrome(){document.querySelector('.preview-note').innerHTML=`<span><strong>Compact detail mockups</strong> &nbsp; Sample accounts and operations.</span><div class="preview-controls"><label for="preview-user">Preview as</label><select id="preview-user" aria-label="Preview sample account">${model.members.map(u=>`<option value="${u.id}" ${u.id===model.currentUser?'selected':''}>${esc(u.name.split(' ')[0])} · ${u.role}</option>`).join('')}</select><button data-action="reset">Reset sample</button></div>`;let switcher=document.querySelector('#detail-switcher');if(!switcher){switcher=document.createElement('nav');switcher.id='detail-switcher';switcher.className='detail-switcher';switcher.setAttribute('aria-label','Five detail mockups');document.querySelector('#shell').before(switcher)}switcher.innerHTML=[['/playlists/night-drive','1. Playlist'],['/library/songs','2. Library'],['/activity','3. Activity'],['/requests','4. Requests'],['/settings/people','5. People']].map(([r,n])=>link(r,n,path().startsWith(r)?'active':'')).join('')}
render=function(){initDetails();let p=path(),parts=p.split('/').filter(Boolean);if(parts[0]==='requests'){let html=parts[1]==='new'?newRequestPage():parts[1]?requestDetail(parts[1]):requestsPage();document.querySelector('#page').innerHTML=html;sidebar()}else if(p==='/settings/people'){document.querySelector('#page').innerHTML=peoplePage();sidebar()}else if(parts[0]==='settings'&&parts[1]==='people'){document.querySelector('#page').innerHTML=parts[2]==='invite'?invitePage():personPage(parts[2]);sidebar()}else if(p==='/account'){document.querySelector('#page').innerHTML=accountPage();sidebar()}else if(p.startsWith('/settings')&&!isAdmin()){document.querySelector('#page').innerHTML=accessPage('Shared service settings are managed by administrators.');sidebar()}else if(parts[0]==='review'&&!isAdmin()){document.querySelector('#page').innerHTML=accessPage('This source entry belongs to Alex. You can request music for your own collection.');sidebar()}else{baseRender();if(!isAdmin()&&parts[0]==='library'&&parts[1]==='songs'&&parts[2]){let page=document.querySelector('#page');page.innerHTML=page.innerHTML.replace('Apple Music XML','Shared music catalog');let target=song(parts[2]);if(target&&state(target)!=='available'&&!page.querySelector('[data-action="download"]'))page.insertAdjacentHTML('beforeend','<div class="page-actions">'+link('/requests/new?song='+target.id,canAcquire()?'Add this music':'Request this music','btn primary')+'</div>')}}previewChrome();};
// Capture acquisition actions before the earlier prototype's direct-download handler.
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;
if(a==='reset'){e.preventDefault();e.stopImmediatePropagation();model=defaultModel();initDetails();selectedSongs=[];query='';libraryFilter='all';save();go('/playlists/night-drive');notify('Sample accounts, requests and density reset.');return}
if(a==='download'){e.preventDefault();e.stopImmediatePropagation();let r=requestMusic(Number(b.dataset.id));if(r)go('/requests/'+r.id);return}
if(['skip','skip-back','resolve','retry-import'].includes(a)&&!isAdmin()){e.preventDefault();e.stopImmediatePropagation();notify('This shared playlist entry belongs to another account.');return}
if(a==='resolve'||a==='retry-import'){model.reviewOwners={...(model.reviewOwners||{}),[Number(b.dataset.id)]:model.currentUser}}
if(a==='cancel-task'&&!isAdmin()){e.preventDefault();e.stopImmediatePropagation();notify('A shared acquisition can only be cancelled by an admin. You may withdraw your pending request.');return}
if(a==='complete'){let id=Number(b.dataset.id);model.requests.filter(r=>r.songId===id&&r.decision==='approved').forEach(r=>r.events.push('Recording imported and available in the shared library.'))}
},true);
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;
if(a==='approve-request'){approveRequest(b.dataset.id);return}
if(a==='decline-request'){if(!isAdmin())return;let r=model.requests.find(r=>r.id===b.dataset.id);let reason=document.querySelector('#decision-note')?.value.trim();if(!reason){notify('Add a short reason before declining.');document.querySelector('#decision-note')?.focus();return}if(r?.decision==='pending'){r.decision='declined';r.events.push('Declined by '+displayUser(model.currentUser)+': '+reason);save();render();notify('Request declined. No files were deleted.')}return}
if(a==='withdraw-request'){let r=model.requests.find(r=>r.id===b.dataset.id);if(r?.userId===model.currentUser&&r.decision==='pending'){r.decision='withdrawn';r.events.push('Requester withdrew this intent.');save();render();notify('Your request was withdrawn. Shared music files are unchanged.')}return}
if(a==='scope'){if(b.dataset.scope==='server'&&!isAdmin())return;model.activityScope=b.dataset.scope;save();render();return}
if(a==='clear-selection'){selectedSongs=[];render();return}
if(a==='request-selected'){let ids=[...selectedSongs],made=[];for(const id of ids){let r=requestMusic(id);if(r)made.push(r)}selectedSongs=[];if(made.length===1)go('/requests/'+made[0].id);else if(made.length)go('/requests?view=all');else{render();notify('Selected songs are already available. No downloads started.')}return}
if(a==='favorite')persistPersonal();
});
document.addEventListener('change',e=>{if(e.target.id==='preview-user'){switchPreviewUser(e.target.value);return}if(e.target.matches('[data-song-select]')){let id=Number(e.target.dataset.songSelect);selectedSongs=e.target.checked?[...new Set([...selectedSongs,id])]:selectedSongs.filter(i=>i!==id);render();return}if(e.target.matches('[data-select-all]')){let ids=[...document.querySelectorAll('[data-song-select]')].map(i=>Number(i.dataset.songSelect));selectedSongs=e.target.checked?[...new Set([...selectedSongs,...ids])]:selectedSongs.filter(i=>!ids.includes(i));render();return}if(e.target.matches('[data-grant]')){if(!isAdmin()){render();notify('Only admins can change permissions.');return}let u=model.members.find(u=>u.id===e.target.dataset.grant);if(!u||u.role!=='Member')return;u.direct=e.target.checked;if(!u.direct){for(const r of model.requests.filter(r=>r.userId===u.id&&r.decision==='approved'&&r.approvalKind==='permission')){if(state(song(r.songId))==='matched'){r.decision='pending';r.events.push('Direct acquisition permission revoked; administrator approval is required.');if(!model.requests.some(o=>o.id!==r.id&&o.songId===r.songId&&o.decision==='approved'))delete model.states[r.songId]}}}save();render();notify(displayUser(u.id)+(u.direct?' can add music directly. File deletion stays blocked.':' now needs admin approval for new music.'));return}});
document.addEventListener('submit',e=>{if(e.target.id==='music-request-form'){e.preventDefault();let r=requestMusic(Number(document.querySelector('#request-song').value),document.querySelector('#request-quality').value,document.querySelector('#request-note').value);if(r)go('/requests/'+r.id);return}if(e.target.id==='invite-member-form'){e.preventDefault();if(!isAdmin())return;let name=document.querySelector('#invite-name').value.trim(),email=document.querySelector('#invite-email').value.trim();if(!name||!email)return;let id='member-'+Date.now();model.members.push({id,name,email,role:'Member',direct:false,navidrome:''});model.personal[id]={favorites:[],deferred:[]};save();go('/settings/people');notify('Sample member created. No invitation email was sent.')}});

if(!location.hash)location.hash='/settings/people';render();

</script></body></html>
