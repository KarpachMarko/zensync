name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go test -race ./...
      - run: go vet ./...
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web run build
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm --dir web run test:e2e
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - run: docker build -t zensync:test -t zensync:migration-test .
      - run: docker pull deluan/navidrome:0.64.2
      - run: python3 scripts/test-navidrome.py
      - name: Verify non-root image and health
        run: |
          docker run -d --name zensync --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp -v zensync-test:/data zensync:test
          for attempt in $(seq 1 20); do
            if docker exec zensync /app/zensync healthcheck; then exit 0; fi
            sleep 1
          done
          docker logs zensync
          exit 1
